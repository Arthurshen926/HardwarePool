[workspace]
resolver = "2"
members = [
    "crates/capyio-core",
    "crates/capyio-data-plane",
    "crates/capyio-audio",
    "crates/capyio-video",
    "crates/capyio-display",
    "crates/capyio-display-transport",
    "crates/capyio-display-tls",
    "adapters/sunshine-moonlight",
    "platform/windows/capyio-display",
    "platform/windows/capyio-display-engine-host",
    "platform/android/capyio-display",
    "crates/capyio-input",
    "crates/capyio-protocol",
    "crates/capyio-control-host",
    "crates/capyio-control-tls",
    "crates/capyio-control-credentials",
    "crates/capyio-control-link",
    "crates/capyio-discovery",
    "crates/capyio-discovery-udp",
    "crates/capyio-pairing",
    "crates/capyio-enrollment",
    "crates/capyio-runtime",
    "crates/capyio-testkit",
    "crates/capyio-adapter-sdk",
    "crates/capyio-adapter-host",
    "adapters/mock-source",
    "adapters/mock-sink",
    "adapters/sensor-server",
    "adapters/audio-share",
    "adapters/micyou",
    "adapters/native-audio-lan",
    "adapters/vcamdroid",
    "adapters/dsu",
    "adapters/viiper",
    "adapters/remote-touchpad",
    "apps/capyio-node",
    "platform/linux/capyio-pairing-store",
    "platform/linux/capyio-host",
    "platform/linux/capyio-audio",
    "platform/linux/capyio-camera",
    "platform/linux/capyio-avc",
    "platform/linux/capyio-touchpad",
    "apps/desktop/src-tauri",
    "platform/windows/capyio-service",
    "platform/windows/micyou-host-config",
    "platform/windows/process-presence",
    "platform/windows/capture-ring",
    "platform/windows/render-ring",
    "platform/windows/capyio-camera",
    "platform/windows/capyio-camera-share",
    "platform/windows/capyio-camera-host",
    "platform/windows/capyio-camera-mf",
    "platform/windows/capyio-input",
    "platform/windows/capyio-credential-protection",
    "platform/windows/capyio-pairing-store",
    "platform/android/capyio-host",
    "platform/android/capyio-jni",
    "xtask",
]
default-members = [
    "crates/capyio-core",
    "crates/capyio-data-plane",
    "crates/capyio-audio",
    "crates/capyio-video",
    "crates/capyio-input",
    "crates/capyio-protocol",
    "crates/capyio-control-host",
    "crates/capyio-control-tls",
    "crates/capyio-control-link",
    "crates/capyio-discovery",
    "crates/capyio-discovery-udp",
    "crates/capyio-pairing",
    "crates/capyio-runtime",
    "crates/capyio-testkit",
    "crates/capyio-adapter-sdk",
    "crates/capyio-adapter-host",
    "adapters/sensor-server",
    "adapters/audio-share",
    "adapters/micyou",
    "adapters/native-audio-lan",
    "apps/capyio-node",
    "platform/linux/capyio-pairing-store",
    "platform/linux/capyio-host",
    "platform/linux/capyio-audio",
    "platform/linux/capyio-camera",
    "platform/linux/capyio-avc",
    "platform/linux/capyio-touchpad",
    "platform/windows/micyou-host-config",
    "platform/windows/process-presence",
    "platform/windows/capture-ring",
    "platform/windows/render-ring",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["CapyIO contributors"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
prost-build = "0.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
sha2 = "0.10.9"
windows = "0.61.3"
windows-future = { version = "0.2.1", features = ["std"] }
protoc-bin-vendored = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", default-features = false }
windows-service = "0.8.1"
jni = "0.22.4"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "symbols"
