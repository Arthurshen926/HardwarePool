[workspace]
resolver = "2"
members = [
    "crates/capyio-core",
    "crates/capyio-data-plane",
    "crates/capyio-audio",
    "crates/capyio-video",
    "crates/capyio-input",
    "crates/capyio-protocol",
    "crates/capyio-runtime",
    "crates/capyio-testkit",
    "crates/capyio-adapter-sdk",
    "crates/capyio-adapter-host",
    "adapters/mock-source",
    "adapters/mock-sink",
    "adapters/sensor-server",
    "adapters/audio-share",
    "adapters/vcamdroid",
    "adapters/dsu",
    "adapters/viiper",
    "adapters/remote-touchpad",
    "apps/capyio-node",
    "apps/desktop/src-tauri",
    "platform/windows/capyio-service",
    "platform/windows/capyio-camera",
    "platform/windows/capyio-input",
    "platform/android/capyio-host",
    "xtask",
]
default-members = [
    "crates/capyio-core",
    "crates/capyio-data-plane",
    "crates/capyio-audio",
    "crates/capyio-video",
    "crates/capyio-input",
    "crates/capyio-protocol",
    "crates/capyio-runtime",
    "crates/capyio-testkit",
    "crates/capyio-adapter-sdk",
    "crates/capyio-adapter-host",
    "adapters/sensor-server",
    "adapters/audio-share",
    "apps/capyio-node",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["CapyIO contributors"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", default-features = false }
windows-service = "0.8.1"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "symbols"
