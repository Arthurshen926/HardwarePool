[workspace]
resolver = "2"
members = [
    "crates/hardwarepool-core",
    "crates/hardwarepool-audio",
    "crates/hardwarepool-protocol",
    "crates/hardwarepool-runtime",
    "crates/hardwarepool-testkit",
    "apps/hardwarepool-node",
    "apps/gui/src-tauri",
    "xtask",
]
default-members = [
    "crates/hardwarepool-core",
    "crates/hardwarepool-audio",
    "crates/hardwarepool-protocol",
    "crates/hardwarepool-runtime",
    "crates/hardwarepool-testkit",
    "apps/hardwarepool-node",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["HardwarePool contributors"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "symbols"
