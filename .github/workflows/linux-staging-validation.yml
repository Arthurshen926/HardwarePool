name: Linux staging validation

# Build, passive inspection and CLI help only. No devices, pairing, keyring or uploads.
on:
  push:
    branches: [codex/linux-ipc-validation-20261019]

permissions:
  contents: read

concurrency:
  group: linux-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [default, paired-store]
    env:
      STAGING_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install official build dependencies in isolated CI only
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config binutils python3 libavcodec-dev libavutil-dev libpipewire-0.3-dev libspa-0.2-dev libevdev-dev pipewire-bin
      - name: Inventory and passive preflight negative tests
        run: python3 -m unittest discover -s scripts -p test_linux_staging.py -v
      - name: Build all five production binaries and stage without executing devices
        run: |
          args=()
          if [[ "$STAGING_PROFILE" == paired-store ]]; then args+=(--paired-store); fi
          python3 scripts/linux_staging.py build "${args[@]}" --output "$RUNNER_TEMP/capyio-linux-stage"
      - name: Independently inspect final staging inventory
        run: |
          python3 scripts/linux_staging.py preflight "$RUNNER_TEMP/capyio-linux-stage"
          python3 - "$RUNNER_TEMP/capyio-linux-stage/manifest.json" "$GITHUB_SHA" <<'PY'
          import json, os, sys
          manifest = json.load(open(sys.argv[1]))
          assert manifest['source'] == {'kind': 'git', 'sha': sys.argv[2], 'worktree': 'clean'}, manifest['source']
          assert manifest['libraries_bundled'] is False
          assert set(manifest['files']) == {
              'capyio-node', 'capyio-linux-console', 'capyio-linux-avc-helper',
              'capyio-linux-camera-helper', 'capyio-linux-touchpad-helper',
          }, manifest['files']
          expected = {
              'capyio-node': ['native-camera', 'native-touchpad'],
              'capyio-linux-console': [],
              'capyio-linux-avc': ['native-pipewire'],
              'capyio-linux-camera': ['native-pipewire'],
              'capyio-linux-touchpad': ['native-uinput'],
          }
          if os.environ['STAGING_PROFILE'] == 'paired-store':
              expected['capyio-node'].append('paired-store')
              expected['capyio-linux-console'].append('paired-store')
          assert manifest['features'] == expected, manifest['features']
          print('Exact clean checkout SHA and five production binaries verified; environment remains unverified.')
          PY
      - name: Check staged CLI help matches feature choice without opening a backend
        run: |
          python3 - "$RUNNER_TEMP/capyio-linux-stage/capyio-node" "$RUNNER_TEMP/capyio-linux-stage/capyio-linux-console" <<'PY'
          import os, subprocess, sys
          node = sys.argv[1]
          paired = os.environ['STAGING_PROFILE'] == 'paired-store'
          def help_for(command):
              return subprocess.run([node, command, '--help'], stdin=subprocess.DEVNULL,
                                    capture_output=True, text=True, timeout=10)
          result = help_for('linux-pairing')
          if paired:
              assert result.returncode == 0, result.stderr
              for flag in ('--trusted-lab', '--pairing-state', '--pairing-node',
                           '--pairing-bus-address', '--pairing-collection'):
                  assert flag in result.stdout, (flag, result.stdout)
          else:
              assert result.returncode == 2, result
              assert "unrecognized subcommand 'linux-pairing'" in result.stderr, result.stderr
          for command in ('linux-camera', 'linux-touchpad', 'linux-playback', 'linux-capture'):
              result = help_for(command)
              assert result.returncode == 0, result.stderr
              assert ('--pairing-state' in result.stdout) == paired, result.stdout
          root_help = subprocess.run([node, '--help'], stdin=subprocess.DEVNULL,
                                     capture_output=True, text=True, timeout=10)
          assert root_help.returncode == 0, root_help.stderr
          assert 'linux-touchpad-fixture' not in root_help.stdout
          fixture_help = help_for('linux-touchpad-fixture')
          # Lab syntax errors deliberately use a static redacted anyhow error,
          # not Clap's usual exit 2, even when the fixture is compiled out.
          assert fixture_help.returncode == 1, fixture_help
          assert fixture_help.stdout == '', fixture_help.stdout
          assert fixture_help.stderr == ('Error: invalid Linux lab playback command; '
              '--trusted-lab is required; credentials must not be supplied in arguments\n'), fixture_help.stderr
          # Console help is identical in both profiles and must succeed without
          # a TTY, bus, credentials, child process or an interactive operation.
          console_help = subprocess.run([sys.argv[2], '--help'], stdin=subprocess.DEVNULL,
                                        capture_output=True, text=True, timeout=10)
          assert console_help.returncode == 0, console_help.stderr
          assert 'capyio-linux-console' in console_help.stdout, console_help.stdout
          for command in ('welcome', 'join', 'list', 'recover', 'revoke', 'cancel'):
              assert command in console_help.stdout, (command, console_help.stdout)
          for flag in ('--pairing-node', '--pairing-state', '--pairing-bus-address',
                       '--pairing-collection'):
              assert flag in console_help.stdout, (flag, console_help.stdout)
          print('Staged CLI help matches selected production features; no operation was started.')
          PY
