name: Linux staging validation

# Build and inspect only. No devices, pairing, PipeWire server or binary uploads.
on:
  push:
    branches: [codex/linux-ipc-validation-20261019]

permissions:
  contents: read

concurrency:
  group: linux-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install official build dependencies in isolated CI only
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config binutils python3 libavcodec-dev libavutil-dev libpipewire-0.3-dev libspa-0.2-dev libevdev-dev pipewire-bin
      - name: Inventory and passive preflight negative tests
        run: python3 -m unittest discover -s scripts -p test_linux_staging.py -v
      - name: Build all production helpers and stage without executing devices
        run: python3 scripts/linux_staging.py build --output "$RUNNER_TEMP/capyio-linux-stage"
      - name: Independently inspect final staging inventory
        run: |
          python3 scripts/linux_staging.py preflight "$RUNNER_TEMP/capyio-linux-stage"
          python3 - "$RUNNER_TEMP/capyio-linux-stage/manifest.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1]))
          assert manifest['source'] == {'kind': 'git', 'sha': sys.argv[2], 'worktree': 'clean'}, manifest['source']
          assert manifest['libraries_bundled'] is False
          assert len(manifest['files']) == 4
          print('Exact clean checkout SHA and four production binaries verified; environment remains unverified.')
          PY
