name: Linux touchpad software validation

# Source-only gate. Never opens /dev/uinput or changes kernel/input permissions.
on:
  push:
    branches: [codex/linux-ipc-validation-20261019]
permissions:
  contents: read
concurrency:
  group: linux-touchpad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  touchpad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install official compile-only dependency in disposable runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libevdev-dev pkg-config dbus
          dpkg-query -W libevdev-dev | tee "$RUNNER_TEMP/touchpad-dependencies.txt"
          pkg-config --modversion libevdev | tee -a "$RUNNER_TEMP/touchpad-dependencies.txt"
      - name: Portable and authenticated owner acceptance
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p capyio-linux-touchpad -- --nocapture | tee "$RUNNER_TEMP/touchpad-rust.txt"
          cargo clippy --locked -p capyio-linux-touchpad --all-targets -- -D warnings
          # Require named acceptance cases so accidental cfg/ignore cannot silently pass.
          for test in android_capture_policy_over_real_mtls_reaches_production_projector_and_stops missing_runtime_lease_and_mismatched_hello_never_open_device revoked_lease_eof_and_idle_deadline_release_active_contacts failed_native_commit_never_acknowledges_the_frame ack_waits_for_complete_backend_commit_not_queue_admission finite_grant_expiry_releases_contacts_without_new_packets revoke_during_blocked_commit_never_acknowledges_and_closes stop_or_changed_grant_before_hello_cannot_create_device initial_update_cannot_acknowledge_or_activate_route runtime_lock_contention_cannot_suspend_shutdown_or_leave_contacts; do
            grep -Fx "test $test ... ok" "$RUNNER_TEMP/touchpad-rust.txt"
          done
      - name: Native compile and production-loop fake syscalls only
        run: |
          set -euo pipefail
          cargo build --locked -p capyio-linux-touchpad --features native-uinput
          cargo build --locked -p capyio-node --features native-touchpad
          cargo clippy --locked -p capyio-linux-touchpad -p capyio-linux-host -p capyio-node --all-targets --features capyio-linux-touchpad/native-uinput,capyio-node/native-touchpad -- -D warnings
          python3 platform/linux/capyio-touchpad/native/test_helper.py | tee "$RUNNER_TEMP/touchpad-fake-native.txt"
          grep -Fx "native helper fake-backend contracts passed (no kernel device accessed)" "$RUNNER_TEMP/touchpad-fake-native.txt"
      - name: Actual finite touchpad executable with fake syscalls only
        run: |
          set -euo pipefail
          # Compile both feature paths together to guard their distinct symbols.
          # Never execute the production native helper or native-touchpad command.
          cargo build --locked -p capyio-linux-touchpad --features native-uinput,test-fixture
          cargo build --locked -p capyio-node --features native-touchpad,touchpad-test-fixture
          cargo test --locked -p capyio-linux-touchpad --features native-uinput,test-fixture --lib -- --nocapture | tee "$RUNNER_TEMP/touchpad-helper-boundaries.txt"
          for test in sibling_checks_reject_missing_symlink_directory_and_writable_binary targets_keep_native_and_fixture_names_distinct; do
            grep -Fx "test transport::tests::$test ... ok" "$RUNNER_TEMP/touchpad-helper-boundaries.txt"
          done
          cargo test --locked -p capyio-linux-touchpad --features test-fixture --test fixture_packaging -- --nocapture | tee "$RUNNER_TEMP/touchpad-fixture-package.txt"
          grep -Fx "test packaged_fixture_runs_real_protocol_and_fake_backend ... ok" "$RUNNER_TEMP/touchpad-fixture-package.txt"
          python3 scripts/test_touchpad_launcher_gate.py
          cargo test --locked -p capyio-node --test linux_touchpad -- --list | tee "$RUNNER_TEMP/touchpad-launcher-default-list.txt"
          cargo test --locked -p capyio-node --test linux_touchpad -- --nocapture | tee "$RUNNER_TEMP/touchpad-launcher-default.txt"
          cargo test --locked -p capyio-node --test linux_touchpad --features touchpad-test-fixture -- --list | tee "$RUNNER_TEMP/touchpad-launcher-list.txt"
          cargo test --locked -p capyio-node --test linux_touchpad --features touchpad-test-fixture -- --nocapture | tee "$RUNNER_TEMP/touchpad-launcher.txt"
          cargo clippy --locked -p capyio-linux-touchpad -p capyio-linux-host -p capyio-node --all-targets --features capyio-linux-touchpad/test-fixture,capyio-node/touchpad-test-fixture -- -D warnings
          # Require exact discovery and successful outcomes; no any-nonzero oracle.
          python3 scripts/check_touchpad_launcher_tests.py "$RUNNER_TEMP"
      - name: Require persisted pairing through finite touchpad helper sessions
        run: |
          set -euo pipefail
          cargo build --locked -p capyio-node --features touchpad-test-fixture,paired-store
          cargo test --locked -p capyio-node --features touchpad-test-fixture,paired-store --bin capyio-node paired_store_cli_tests
          cargo test --locked -p capyio-node --test linux_touchpad --features touchpad-test-fixture,paired-store software_fixture -- --list | tee "$RUNNER_TEMP/touchpad-paired-list.txt"
          CAPYIO_TOUCHPAD_PAIRED_STORE=1 timeout --signal=TERM --kill-after=5s 240s cargo test --locked -p capyio-node --test linux_touchpad --features touchpad-test-fixture,paired-store software_fixture -- --test-threads=1 --nocapture | tee "$RUNNER_TEMP/touchpad-paired.txt"
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          from check_touchpad_launcher_tests import FIXTURE, require
          root = pathlib.Path(sys.argv[1])
          require(FIXTURE + ('software_fixture::ipc_linux_touchpad_paired_store_approval_pin_and_revocation_boundary',), (root / 'touchpad-paired-list.txt').read_text(), (root / 'touchpad-paired.txt').read_text())
          PY
          cargo clippy --locked -p capyio-node -p capyio-linux-host --features paired-store,touchpad-test-fixture --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-touchpad-software-evidence
          path: |
            ${{ runner.temp }}/touchpad-*.txt
          if-no-files-found: ignore
