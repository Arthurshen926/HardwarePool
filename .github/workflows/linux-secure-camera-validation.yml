name: Linux secure camera validation

# Source-only, hardware-free experiment. No release/package artifacts.
on:
  push:
    branches: [codex/linux-ipc-validation-20261019]
permissions:
  contents: read
concurrency:
  group: linux-secure-camera-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secure-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install official validation dependencies in disposable runner only
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libavcodec-dev libavutil-dev libpipewire-0.3-dev libspa-0.2-dev pipewire-bin dbus
          dpkg-query -W libavcodec-dev libavutil-dev libpipewire-0.3-dev | tee "$RUNNER_TEMP/avc-dependencies.txt"
          cat > "$RUNNER_TEMP/avc-license.c" <<'C'
          #include <stdio.h>
          #include <libavcodec/avcodec.h>
          #include <libavutil/avutil.h>
          int main(void) {
            printf("avcodec_version=%u\navcodec_license=%s\navcodec_configuration=%s\n", avcodec_version(), avcodec_license(), avcodec_configuration());
            printf("avutil_version=%u\navutil_license=%s\navutil_configuration=%s\n", avutil_version(), avutil_license(), avutil_configuration());
            return 0;
          }
          C
          cc "$RUNNER_TEMP/avc-license.c" $(pkg-config --cflags --libs libavcodec libavutil) -o "$RUNNER_TEMP/avc-license"
          "$RUNNER_TEMP/avc-license" | tee -a "$RUNNER_TEMP/avc-dependencies.txt"
      - name: Require default and native checks
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p capyio-linux-avc -p capyio-protocol -p capyio-control-link -p capyio-control-tls -p capyio-android-jni
          python3 -m unittest discover -s scripts -p test_pipewire_secure_camera.py -v
          cargo test --locked -p capyio-linux-avc --example secure_camera_graph_driver --features native-pipewire
          cargo clippy --locked -p capyio-linux-avc --all-targets --features native-pipewire -- -D warnings
          cargo build --locked -p capyio-linux-avc --features native-pipewire --bin capyio-linux-avc-helper --example secure_camera_graph_driver
          cargo build --locked -p capyio-linux-camera --features native-pipewire --bin capyio-linux-camera-helper
          cp target/debug/capyio-linux-avc-helper target/debug/deps/capyio-linux-avc-helper
          cp target/debug/capyio-linux-avc-helper target/debug/examples/capyio-linux-avc-helper
          cp target/debug/capyio-linux-camera-helper target/debug/examples/capyio-linux-camera-helper
      - name: Require actual decoder IPC pixels and negative tests
        run: |
          set -euo pipefail
          CAPYIO_AVC_HOSTED_GATE=1 cargo test --locked -p capyio-linux-avc --features native-avc hosted_decoder -- --ignored --nocapture | tee "$RUNNER_TEMP/avc-decoder.txt"
          grep -Fx CAPYIO_AVC_PIXELS_ORDER_PTS_CLEANUP_PASS "$RUNNER_TEMP/avc-decoder.txt"
          grep -Fx CAPYIO_AVC_NEGATIVE_REVOKE_CLEANUP_PASS "$RUNNER_TEMP/avc-decoder.txt"
          python3 scripts/test_avc_native_helper.py "$PWD/target/debug/capyio-linux-avc-helper"
      - name: Require same-owner private PipeWire readback and cleanup
        run: |
          set -euo pipefail
          cc -std=gnu11 -O2 -Wall -Wextra -Werror platform/linux/capyio-avc/native/test_decoder_consumer.c $(pkg-config --cflags --libs libpipewire-0.3) -o "$RUNNER_TEMP/avc-consumer"
          for scenario in pixels no_consumer expiry control_stop control_eof partial_cavc source_revoke sink_revoke child_exit decoder_exit server_disconnect; do
            timeout --signal=TERM --kill-after=5s 35s python3 scripts/run_pipewire_secure_camera.py \
              --hosted-private-secure-camera --driver target/debug/examples/secure_camera_graph_driver \
              --helper target/debug/examples/capyio-linux-camera-helper \
              --decoder target/debug/examples/capyio-linux-avc-helper \
              --consumer "$RUNNER_TEMP/avc-consumer" --scenario "$scenario" \
              | tee "$RUNNER_TEMP/avc-graph-$scenario.txt"
            grep -Fx "capyio_pipewire_secure_camera=passed scenario=$scenario real_graph=true owned_cleanup=true" "$RUNNER_TEMP/avc-graph-$scenario.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-secure-camera-text-evidence
          path: |
            ${{ runner.temp }}/avc-dependencies.txt
            ${{ runner.temp }}/avc-decoder.txt
            ${{ runner.temp }}/avc-graph-*.txt
          if-no-files-found: ignore

      - name: Require actual capyio-node launcher pure checks and build
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_pipewire_camera_launcher.py -v
          python3 -m py_compile scripts/run_pipewire_camera_launcher.py scripts/test_pipewire_camera_launcher.py
          cargo test --locked -p capyio-node --features paired-store --test linux_camera -- --list | tee "$RUNNER_TEMP/camera-launcher-tests-list.txt"
          cargo test --locked -p capyio-node --features paired-store --test linux_camera -- --test-threads=1 | tee "$RUNNER_TEMP/camera-launcher-tests.txt"
          while IFS= read -r test_name; do
            grep -Fx "$test_name: test" "$RUNNER_TEMP/camera-launcher-tests-list.txt"
            grep -Fx "test $test_name ... ok" "$RUNNER_TEMP/camera-launcher-tests.txt"
          done <<'TESTS'
          ipc_linux_camera_requires_exact_approval_and_independent_android_consent
          ipc_linux_camera_wrong_request_or_route_fails_closed
          ipc_linux_camera_android_denial_fails_before_media_children
          ipc_linux_camera_bad_config_and_source_fail_closed
          ipc_linux_camera_dynamic_offer_still_has_no_media_children_before_binding
          ipc_linux_camera_preapproval_eof_is_terminal
          ipc_linux_camera_partial_bootstrap_has_whole_frame_deadline
          ipc_linux_camera_wrong_certificate_pin_fails_without_children
          ipc_linux_camera_malformed_approval_commands_fail_closed
          ipc_linux_camera_expired_or_wrong_source_grant_is_rejected
          ipc_linux_camera_wrong_data_pin_never_spawns_helpers
          ipc_linux_camera_denied_or_missing_source_lease_fails_before_helpers
          ipc_linux_camera_configured_source_must_exist_in_authenticated_catalog
          ipc_paired_camera_pinned_peer_without_local_approval_never_activates
          ipc_paired_camera_wrong_control_pin_never_spawns_helpers
          ipc_paired_camera_revoked_store_never_opens_listener
          TESTS
          grep -Fx 'hosted_linux_camera_graph: test' "$RUNNER_TEMP/camera-launcher-tests-list.txt"
          cargo clippy --locked -p capyio-node --all-targets --features native-camera,paired-store -- -D warnings
          cargo build --locked -p capyio-node --features native-camera,paired-store --bin capyio-node
          cargo test --locked -p capyio-node --features native-camera,paired-store --test linux_camera --no-run --message-format=json > "$RUNNER_TEMP/camera-launcher-build.jsonl"
          python3 - "$RUNNER_TEMP/camera-launcher-build.jsonl" "$RUNNER_TEMP/camera-launcher-driver" <<'PY'
          import json, pathlib, sys
          records = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          paths = {record['executable'] for record in records if record.get('reason') == 'compiler-artifact' and record.get('target', {}).get('name') == 'linux_camera' and record.get('executable')}
          if len(paths) != 1:
              raise SystemExit('expected exactly one launcher fixture executable')
          pathlib.Path(sys.argv[2]).write_text(paths.pop())
          PY
      - name: Require actual executable private camera graph and verified failures
        run: |
          set -euo pipefail
          driver="$(cat "$RUNNER_TEMP/camera-launcher-driver")"
          for scenario in pixels local_stop control_stop control_eof source_revoke partial_cavc expiry handshake_timeout; do
            timeout --signal=TERM --kill-after=5s 40s python3 scripts/run_pipewire_camera_launcher.py \
              --hosted-private-camera-launcher --driver "$driver" --node target/debug/capyio-node \
              --helper target/debug/capyio-linux-camera-helper --decoder target/debug/capyio-linux-avc-helper \
              --consumer "$RUNNER_TEMP/avc-consumer" --scenario "$scenario" \
              | tee "$RUNNER_TEMP/camera-launcher-$scenario.txt"
            graph=true
            if [ "$scenario" = handshake_timeout ]; then graph=false; fi
            grep -Fx "capyio_pipewire_camera_launcher=passed scenario=$scenario actual_executable=true paired_store=false real_graph=$graph owned_cleanup=true" "$RUNNER_TEMP/camera-launcher-$scenario.txt"
          done
      - name: Require paired-store actual executable camera sessions
        run: |
          set -euo pipefail
          driver="$(cat "$RUNNER_TEMP/camera-launcher-driver")"
          for scenario in pixels local_stop control_stop control_eof source_revoke partial_cavc expiry handshake_timeout; do
            timeout --signal=TERM --kill-after=5s 45s python3 scripts/run_pipewire_camera_launcher.py \
              --hosted-private-camera-launcher --paired-store --driver "$driver" --node target/debug/capyio-node \
              --helper target/debug/capyio-linux-camera-helper --decoder target/debug/capyio-linux-avc-helper \
              --consumer "$RUNNER_TEMP/avc-consumer" --scenario "$scenario" \
              | tee "$RUNNER_TEMP/camera-launcher-paired-$scenario.txt"
            graph=true
            if [ "$scenario" = handshake_timeout ]; then graph=false; fi
            grep -Fx "capyio_pipewire_camera_launcher=passed scenario=$scenario actual_executable=true paired_store=true real_graph=$graph owned_cleanup=true" "$RUNNER_TEMP/camera-launcher-paired-$scenario.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-camera-launcher-text-evidence
          path: |
            ${{ runner.temp }}/camera-launcher-*.txt
            ${{ runner.temp }}/camera-launcher-build.jsonl
          if-no-files-found: ignore
