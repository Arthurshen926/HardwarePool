name: Linux IPC validation

# Experimental, hardware-free validation only. No default-branch or PR trigger.
on:
  push:
    branches: [codex/linux-ipc-validation-20261019]

permissions:
  contents: read

concurrency:
  group: linux-ipc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ipc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Linux host, node and mock adapters
        run: cargo clippy --locked -p capyio-mock-source -p capyio-mock-sink -p capyio-linux-host -p capyio-node -p capyio-linux-audio -p capyio-native-audio-lan -p capyio-control-tls -p capyio-control-link --all-targets -- -D warnings
      - name: Build repository mock adapters
        run: cargo build --locked -p capyio-mock-source -p capyio-mock-sink
      - name: Require finite IPC regression tests
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/required-ipc-tests.txt" <<'TESTS'
          payload::tests::parser_consumes_exact_fixture_and_validates_receipt
          payload::tests::parser_rejects_wrong_identity_epoch_profile_and_corruption
          payload::tests::endpoint_contract_and_private_directory_are_required
          payload::tests::separate_socket_transfer_and_bound_receipt
          payload::tests::missing_sink_and_sender_have_bounded_failures
          payload::tests::oversized_datagram_is_not_accepted_after_truncation
          payload_requires_explicit_lifecycle_opt_in
          payload_crosses_real_children_once_per_epoch_and_cleans_on_every_exit
          payload::tests::batch_parser_orders_all_records_and_binds_complete_receipt
          payload::tests::batch_parser_rejects_gaps_replay_binding_timing_and_partial_completion
          payload::tests::batch_queue_overflow_is_transactional_without_eviction
          payload::tests::batch_separate_socket_transfer_and_complete_receipt
          payload::tests::batch_paced_partial_sender_cannot_renew_whole_transfer_budget
          payload::tests::batch_saturated_kernel_queue_bounds_source_failure_and_cleans_endpoint
          payload::tests::batch_missing_partial_and_oversized_input_fail_within_budget
          mock_routes::tests::batch_faults_drop_both_children_and_remove_owned_directory
          batch_requires_opt_in_and_rejects_payload_conflict
          batch_crosses_real_children_once_per_epoch_and_cleans_on_every_exit
          tests::owner_stdin_eof_byte_or_error_requests_stop
          tests::launch_requires_explicit_lab_addresses_target_and_finite_duration
          tests::partial_writes_preserve_exact_pcm_without_interleaving
          tests::replay_reset_reorder_and_wrong_binding_are_rejected_but_gaps_allowed
          tests::congestion_and_trickled_writes_cannot_renew_stall_budget
          tests::expiry_and_clock_regression_do_not_write_pending_pcm
          tests::child_failure_is_checked_even_without_a_pending_packet
          tests::sequence_overflow_cannot_wrap_to_a_fresh_stream
          pipewire::tests::exact_pipewire_arguments_never_use_a_shell_or_default_target
          pipewire::tests::ipc_child_eof_and_repeated_stop_reap_owned_process
          pipewire::tests::ipc_early_child_exit_is_not_playback_readiness
          pipewire::tests::ipc_full_stdin_never_blocks_stop_and_child_is_reaped
          pipewire::tests::ipc_android_wire_udp_to_owned_pcm_process_preserves_exact_bytes
          single_fragment_round_trip_preserves_every_wire_field
          malformed_and_conflicting_fragments_fail_closed
          udp_loopback_delivers_fragmented_stereo_and_rejects_another_peer
          route::tests::route_preflight_rejects_missing_lease_before_open
          route::tests::route_dynamic_pcm_start_stop_and_drop_are_owned
          route::tests::route_expiry_during_receive_does_not_forward_pcm
          route::tests::route_open_failure_releases_lease_and_reports_offline
          route::tests::route_expiry_during_open_rolls_back_resources
          route::tests::route_grant_change_disconnect_and_clock_regression_fail_closed
          route::tests::route_stale_owner_cannot_stop_restarted_epoch
          route::tests::route_media_and_cleanup_failures_are_not_success
          route::tests::route_wrong_binding_and_finite_lifetime_fail_closed
          route::tests::ipc_dynamic_route_udp_pcm_stop_releases_socket_and_lease
          route::tests::route_stop_cleanup_failure_is_stopping_not_active
          route::tests::route_runtime_stop_request_cleans_before_more_media
          owner::tests::admission_requires_exact_paired_session_and_existing_local_lease
          owner::tests::admission_rejects_implicit_target_public_address_and_wrong_offer
          owner::tests::admission_rejects_shared_session_but_preserves_other_sessions
          owner::tests::ipc_authenticated_owner_offer_drives_dynamic_pcm_and_stop
          owner::tests::ipc_authenticated_owner_wrong_stream_never_opens_media
          owner::tests::ipc_authenticated_owner_disconnect_closes_media_and_lease
          owner::tests::ipc_authenticated_owner_timeout_is_terminal_not_idle_retry
          owner::tests::ipc_authenticated_owner_drop_closes_control_and_udp
          deadline_tests::ipc_trickled_frame_cannot_renew_whole_operation_deadline
          deadline_tests::ipc_success_cancels_deadline_watcher_without_closing_connection
          owner::tests::ipc_authenticated_owner_read_deadline_is_clamped_to_lease
          playback::tests::supervision_idle_steps_continue_until_peer_stop
          playback::tests::supervision_local_stop_and_owner_loss_prevent_offer
          playback::tests::supervision_stop_after_poll_is_observed_without_another_step
          playback::tests::supervision_failures_always_cleanup_and_never_report_success
          playback::tests::supervision_stop_handle_is_bounded_and_idempotent
          owner::tests::ipc_poll_idle_control_keeps_media_and_remote_stop_live
          owner::tests::ipc_poll_handshake_uses_authenticated_offer_and_does_not_restart
          owner::tests::ipc_poll_idle_lease_expiry_and_disconnect_cleanup
          tests::incremental_poll_preserves_fragments_and_coalesced_frames
          tests::incremental_poll_bounds_lengths_and_plaintext_work
          tests::incremental_poll_deadline_is_not_renewed_and_blocking_mix_fails
          tests::incremental_poll_rejects_malformed_and_truncated_plaintext
          tests::incremental_poll_transport_enforces_shared_call_byte_and_time_budgets
          tests::ipc_incremental_poll_real_tls_idle_fragments_and_coalesced_frames
          tests::ipc_incremental_poll_partial_frame_deadline_and_expired_idle_are_terminal
          ipc_host_idle_control_survives_read_deadline_then_local_stop_closes_session
          ipc_host_last_stop_handle_drop_closes_session
          ipc_host_authenticated_peer_stop_closes_session
          ipc_host_control_disconnect_fails_closed
          launcher_io::tests::fragmented_frames_do_not_overread
          launcher_io::tests::oversized_zero_and_eof_are_terminal_and_clear
          launcher_io::tests::nonblocking_and_interrupted_preserve_partial_state
          launcher_io::tests::partial_frame_timer_is_nonrenewable_but_idle_has_no_timer
          launcher_io::tests::partial_body_is_erased_on_read_error
          launcher_io::tests::write_backpressure_and_trickle_cannot_extend_deadline
          launcher_io::tests::serialization_is_length_prefixed_and_bounded
          launcher_io::tests::writes_are_bounded_and_errors_sanitized
          launch::tests::launch_config_is_explicit_finite_and_not_a_secret_error_or_authorization
          launch::tests::local_command_rejects_unknown_fields_and_keeps_stop_separate_from_approval
          ipc_linux_playback_approved_finite_offer_status_and_stop
          ipc_linux_playback_wrong_nonce_or_route_rejected_without_offer
          ipc_linux_playback_launcher_eof_cancels_before_authorization
          ipc_linux_playback_blocked_stdout_exits_within_write_deadlines
          ipc_linux_playback_previous_invocation_approval_cannot_be_replayed
          ipc_linux_playback_preplayed_approval_rejected_before_peer
          ipc_linux_playback_malformed_secret_bootstrap_is_redacted
          ipc_linux_playback_requires_explicit_opt_in_and_default_remains_demo
          tests::secret_der_cleanup_clears_entire_transient_buffer
          tests::secret_der_rejects_invalid_borrowed_encoding
          tests::secret_der_server_rejects_invalid_ca_before_key_handoff
          tests::accept_deadline_check_rejects_expired_budget_without_io
          tests::ipc_try_accept_idle_is_immediate_and_expired_idle_is_error
          tests::ipc_try_accept_pinned_tls_exact_and_fresh_binding_succeed
          tests::ipc_try_accept_trickled_handshake_cannot_renew_whole_deadline
          tests::ipc_try_accept_trickled_binding_shares_handshake_deadline
          launch::tests::local_sink_catalog_requires_no_source_publication_selection
          launch::tests::preconsent_requires_available_source_and_keeps_route_unauthorized
          TESTS
          cargo test --locked -p capyio-mock-source -p capyio-mock-sink -p capyio-linux-host -p capyio-node -p capyio-linux-audio -p capyio-native-audio-lan -p capyio-control-tls -p capyio-control-link --all-targets -- --list --color never | tee "$RUNNER_TEMP/linux-test-list.txt"
          while IFS= read -r test_name; do
            grep -Fx -- "$test_name: test" "$RUNNER_TEMP/linux-test-list.txt"
          done < "$RUNNER_TEMP/required-ipc-tests.txt"
      - name: Run Linux host, mock adapter and real process tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 240s cargo test --locked -p capyio-mock-source -p capyio-mock-sink -p capyio-linux-host -p capyio-node -p capyio-linux-audio -p capyio-native-audio-lan -p capyio-control-tls -p capyio-control-link --all-targets -- --test-threads=1 --color never | tee "$RUNNER_TEMP/linux-test-results.txt"
          while IFS= read -r test_name; do
            grep -Fx -- "test $test_name ... ok" "$RUNNER_TEMP/linux-test-results.txt"
          done < "$RUNNER_TEMP/required-ipc-tests.txt"
