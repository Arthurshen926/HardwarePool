                | tee "$RUNNER_TEMP/console-$mode-$scenario.txt"
              grep -Fx "capyio_audio_console_graph=passed mode=$mode scenario=$scenario actual_console=true protected_read=true independent_graph=true cleanup=true" "$RUNNER_TEMP/console-$mode-$scenario.txt"
              count=$((count + 1))
            done
          done
          test "$count" -eq 16

      - name: Require finite pinned TLS mono audio and independent PipeWire readback
        run: |
