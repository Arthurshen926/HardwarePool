              | tee "$RUNNER_TEMP/pipewire-virtual-speaker-$scenario-result.txt"
            grep -Fx "capyio_pipewire_virtual_speaker=passed scenario=$scenario pinned_tls=true independent_consent=true dynamic_udp=true stereo=true real_sink=true simulated_app=true environment_sanitized=true stop=true cleanup=true" \
              "$RUNNER_TEMP/pipewire-virtual-speaker-$scenario-result.txt"
          done
      - name: Require paired IncomingDraft independent approval and finite Source lease
        run: |
          set -euo pipefail
          test_name=incoming_draft::ipc_linux_incoming_paired_store_requires_independent_local_approval
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p capyio-node --features paired-store --test linux_playback "$test_name" -- --exact --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/audio-paired-incoming.txt"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/audio-paired-incoming.txt"
          grep -F 'capyio_audio_paired_store=passed protected_read=true secret_redacted=true' "$RUNNER_TEMP/audio-paired-incoming.txt"
      - name: Require all sixteen paired-store audio graph scenarios without skips
        run: |
          set -euo pipefail
          playback="$(python3 - "$RUNNER_TEMP/pipewire-e2e-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'linux_playback' and item.get('executable')]
          assert len(matches) == 1
