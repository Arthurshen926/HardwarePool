          print(matches[0])
          PYFIXTURE
          )"
          for scenario in waveform child_exit server_disconnect control_disconnect timeout; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_capture.py \
              --hosted-pipewire-capture --fixture "$fixture" --scenario "$scenario" \
