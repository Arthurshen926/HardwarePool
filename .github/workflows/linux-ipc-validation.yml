          timeout --signal=TERM --kill-after=10s 240s cargo test --locked -p capyio-mock-source -p capyio-mock-sink -p capyio-linux-host -p capyio-node -p capyio-linux-audio -p capyio-native-audio-lan -p capyio-control-tls -p capyio-control-link -p capyio-core -p capyio-runtime -p capyio-android-jni -p capyio-protocol --all-targets -- --test-threads=1 --color never | tee "$RUNNER_TEMP/linux-test-results.txt"
