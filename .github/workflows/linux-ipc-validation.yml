name: Linux IPC validation

# Experimental, hardware-free validation only. No default-branch or PR trigger.
on:
  push:
    branches: [codex/linux-ipc-validation-20261019]

permissions:
  contents: read

concurrency:
  group: linux-ipc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ipc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Linux host, node and mock adapters
        run: cargo clippy --locked -p capyio-mock-source -p capyio-mock-sink -p capyio-linux-host -p capyio-node -p capyio-linux-audio -p capyio-native-audio-lan -p capyio-control-tls -p capyio-control-link -p capyio-core -p capyio-runtime -p capyio-android-jni -p capyio-protocol --all-targets -- -D warnings
      - name: Validate Linux pairing persistence boundary
        run: |
          cargo test --locked -p capyio-linux-pairing-store
          if ! command -v dbus-daemon; then sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus; fi
          timeout --signal=TERM --kill-after=10s 240s cargo test --locked -p capyio-linux-pairing-store --features native-secret-service -- --test-threads=1
          cargo clippy --locked -p capyio-linux-pairing-store --all-targets --features native-secret-service -- -D warnings
      - name: Validate persisted pairing launcher boundary
        run: |
          cargo test --locked -p capyio-node --features paired-store --test linux_paired_store -- --list | tee "$RUNNER_TEMP/paired-launcher-tests.txt"
          for test in ipc_paired_store_camera_and_touchpad_listen_without_grant_and_stop_cleanly ipc_paired_store_invalid_peer_or_backend_fails_before_listening_or_helper ipc_paired_store_rejects_legacy_credential_frames_in_selected_mode paired_store_cli_rejects_incomplete_selector_set_without_access ipc_paired_store_audio_loads_credentials_without_helpers_and_stops ipc_paired_store_audio_binding_and_backend_fail_before_listener ipc_paired_store_audio_rejects_mixed_bootstrap_without_keyring_access ipc_paired_store_secure_playback_rejects_unsupported_modes_and_mixed_credentials; do
            grep -Fx "$test: test" "$RUNNER_TEMP/paired-launcher-tests.txt"
          done
          timeout --signal=TERM --kill-after=10s 600s cargo test --locked -p capyio-node --features paired-store --test linux_paired_store --test linux_camera --test linux_touchpad -- --test-threads=1
          cargo test --locked -p capyio-node --features paired-store --bin capyio-node paired_store_cli_tests
          cargo clippy --locked -p capyio-node -p capyio-linux-host --features paired-store --all-targets -- -D warnings
      - name: Require read-only authenticated catalog Node and terminal proof
        run: |
          set -euo pipefail
          cargo build --locked -p capyio-node -p capyio-linux-console --features paired-store
          cargo test --locked -p capyio-linux-host --features paired-store catalog_inspect::tests
          cargo test --locked -p capyio-linux-console --features paired-store --bin capyio-linux-console
          cargo test --locked -p capyio-node --features paired-store --test linux_catalog -- --list --color never | tee "$RUNNER_TEMP/catalog-tests.txt"
          cat > "$RUNNER_TEMP/catalog-required.txt" <<'TESTS'
          ipc_catalog_authenticated_ids_directions_formats_read_only
          ipc_catalog_pin_and_node_binding_fail_closed
          ipc_catalog_store_failures_never_dial_or_mutate
          ipc_catalog_config_and_marker_reject_before_store_access
          ipc_catalog_malformed_and_oversized_catalog_has_no_partial_output
          ipc_catalog_route_and_control_payloads_close_without_response
          ipc_catalog_peer_eof_and_absolute_timeout_are_bounded
          ipc_catalog_untrusted_fields_are_ascii_escaped_and_metadata_omitted
          pty_catalog_actual_console_and_node_show_verified_public_ids
          pty_catalog_actual_console_rejects_incomplete_or_wrong_peer_catalog
          pty_prepare_camera_exports_only_explicit_current_selection
          pty_prepare_camera_rejects_unsupported_catalog_rows
          pty_prepare_camera_rejects_mismatched_stale_multiple_and_pretyped_selection
          pty_prepare_camera_requires_fresh_exact_output_confirmation
          pty_prepare_camera_cancel_and_eof_never_create_output
          pty_prepare_camera_refuses_existing_and_symlink_outputs
          pty_prepare_audio_and_touchpad_export_exact_explicit_selection
          pty_prepare_audio_and_touchpad_reject_unsupported_catalog_rows
          pty_prepare_audio_and_touchpad_reject_invalid_and_mixed_options
          pty_prepare_audio_and_touchpad_reject_mismatched_selection
          pty_prepare_audio_and_touchpad_cancel_and_eof_never_create_output
          pty_prepare_audio_and_touchpad_refuse_existing_and_unsafe_outputs
          TESTS
          while IFS= read -r name; do
            grep -Fx "$name: test" "$RUNNER_TEMP/catalog-tests.txt"
          done < "$RUNNER_TEMP/catalog-required.txt"
          timeout --signal=TERM --kill-after=10s 240s cargo test --locked -p capyio-node --features paired-store --test linux_catalog -- --test-threads=1 --color never | tee "$RUNNER_TEMP/catalog-results.txt"
          while IFS= read -r name; do
            grep -Fx "test $name ... ok" "$RUNNER_TEMP/catalog-results.txt"
          done < "$RUNNER_TEMP/catalog-required.txt"
          grep -F 'test result: ok. 22 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/catalog-results.txt"
      - name: Require explicit finite enrollment management against isolated peers
        run: |
          set -euo pipefail
          cargo test --locked -p capyio-linux-host --features paired-store --lib pairing_management::tests
          cargo test --locked -p capyio-node --features paired-store --test linux_pairing_management -- --list | tee "$RUNNER_TEMP/pairing-management-tests.txt"
          for test in ipc_pairing_bilateral_enrollment_lists_bootstraps_and_explicitly_revokes ipc_pairing_rejects_preapproval_wrong_peer_stale_request_and_replay ipc_pairing_requires_peer_approval_and_cancel_or_eof_never_persists ipc_pairing_locked_or_missing_backend_fails_before_networking ipc_pairing_revoke_rejects_stale_wrong_peer_replay_cancel_and_eof ipc_pairing_pending_or_corrupt_journal_blocks_before_networking ipc_pairing_existing_and_revoked_peer_cannot_replace_identity ipc_pairing_uncertain_create_retains_item_without_claiming_saved_or_retrying ipc_recovery_pending_inspection_and_challenge_are_metadata_only ipc_recovery_rejects_mismatched_confirmation_cancel_and_eof ipc_recovery_requires_fresh_challenge_and_revalidates_journal ipc_recovery_missing_locked_or_corrupt_credential_retains_journal ipc_recovery_commits_pending_or_stale_journal_without_replacing_identity ipc_recovery_rejects_corrupt_or_revoked_journal; do
            grep -Fx "$test: test" "$RUNNER_TEMP/pairing-management-tests.txt"
          done
          timeout --signal=TERM --kill-after=10s 360s cargo test --locked -p capyio-node --features paired-store --test linux_pairing_management -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/pairing-management-results.txt"
          grep -F 'test result: ok. 14 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/pairing-management-results.txt"
      - name: Require isolated interactive console pairing and terminal lifecycle
        run: |
          set -euo pipefail
          cargo build --locked -p capyio-node -p capyio-linux-console --features capyio-node/paired-store,capyio-linux-console/paired-store
          cargo clippy --locked -p capyio-linux-console --features paired-store --all-targets -- -D warnings
          cargo test --locked -p capyio-linux-console --features paired-store --bin capyio-linux-console
          cargo test --locked -p capyio-linux-console --features paired-store --test linux_console_pty -- --list | tee "$RUNNER_TEMP/console-tests.txt"
          for test in ipc_console_bilateral_pairing_uses_actual_nodes_and_distinct_protected_identities ipc_console_waiting_cancel_interrupt_and_eof_close_and_reap_without_persistence ipc_console_one_sided_approval_cannot_persist_and_cancellation_reaps_both_nodes ipc_console_rejects_yes_stale_request_wrong_peer_and_prebuffered_approval ipc_console_missing_controlling_tty_refuses_before_protected_backend_access ipc_console_locked_backend_fails_before_invitation_or_networking ipc_console_list_and_exact_revoke_are_metadata_only_and_keep_protected_identity ipc_console_recovery_binds_exact_digest_and_never_claims_remote_completion ipc_console_malformed_partial_and_out_of_sequence_child_events_fail_closed_and_reap ipc_console_exact_preplayed_confirmation_is_flushed_before_fresh_challenge; do
            grep -Fx "$test: test" "$RUNNER_TEMP/console-tests.txt"
          done
          timeout --signal=TERM --kill-after=10s 360s cargo test --locked -p capyio-linux-console --features paired-store --test linux_console_pty -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/console-results.txt"
          grep -F 'test result: ok. 10 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/console-results.txt"
      - name: Require finite manual welcome through two actual nodes and private invitation FIFO
        run: |
          set -euo pipefail
          cargo test --locked -p capyio-linux-host --features paired-store --lib invitation_pipe::tests
          timeout --signal=TERM --kill-after=10s 90s cargo test --locked -p capyio-enrollment --lib -- --test-threads=1
          cargo test --locked -p capyio-node --features paired-store --test linux_pairing_welcome -- --list | tee "$RUNNER_TEMP/pairing-welcome-tests.txt"
          for test in ipc_welcome_two_nodes_bilateral_approval_preserves_separate_protected_identities ipc_welcome_waiting_cancel_and_eof_close_without_persistence ipc_welcome_two_nodes_require_both_approvals_and_cancel_or_eof_never_persist ipc_welcome_rejects_wrong_peer_stale_nonce_and_pipelined_preapproval ipc_welcome_invalid_secret_channels_and_bind_fail_without_invitation ipc_welcome_locked_backend_fails_before_binding_or_secret_output ipc_welcome_wrong_pin_consumes_window_without_replacement_or_restart ipc_welcome_second_joiner_cannot_replace_selected_peer_or_reuse_window ipc_welcome_fixed_three_minute_expiry_closes_without_approval_or_persistence ipc_welcome_rejects_same_fifo_as_ordinary_stdout_by_inode; do
            grep -Fx "$test: test" "$RUNNER_TEMP/pairing-welcome-tests.txt"
          done
          timeout --signal=TERM --kill-after=10s 420s cargo test --locked -p capyio-node --features paired-store --test linux_pairing_welcome -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/pairing-welcome-results.txt"
          grep -F 'test result: ok. 10 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/pairing-welcome-results.txt"
      - name: Build repository mock adapters
        run: cargo build --locked -p capyio-mock-source -p capyio-mock-sink
      - name: Require finite IPC regression tests
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/required-ipc-tests.txt" <<'TESTS'
          secure_audio_has_distinct_tag_exact_format_and_actual_port
