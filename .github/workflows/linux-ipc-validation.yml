  android-compile-contracts:
    # Cross-compile and hardware-free contracts only. No APK signing/deployment,
    # SDK installation/license acceptance, device connection or credential use.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require preinstalled pinned NDK and JDK
        run: |
          set -euo pipefail
          ndk="${ANDROID_HOME:?Runner Android SDK path is missing}/ndk/29.0.14206865"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          jdk="${JAVA_HOME_17_X64:?Runner JDK 17 is missing}"
          for tool in "$bin/aarch64-linux-android29-clang" "$bin/llvm-ar" "$bin/llvm-nm" "$jdk/bin/javac" "$jdk/bin/java"; do
            test -x "$tool" || { echo 'Required preinstalled Android/JDK tool is missing; no install fallback.' >&2; exit 1; }
          done
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*29\.0\.14206865[[:space:]]*$' "$ndk/source.properties"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android29-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android29-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "ANDROID_CONTRACT_NM=$bin/llvm-nm"
            echo "JAVA_HOME=$jdk"
          } >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"
          "$jdk/bin/javac" -version
          "$bin/aarch64-linux-android29-clang" --version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - name: Compile actual Android JNI target and shared library
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 900s cargo build --locked --target aarch64-linux-android -p capyio-android-jni --release
          test -s target/aarch64-linux-android/release/libcapyio_android_jni.so
      - name: Compile dependency-free Java contracts and native declarations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-contract-classes" "$RUNNER_TEMP/android-jni-headers"
          find platform/android/node-contract/src/main/java platform/android/native-lan-contract/src/main/java platform/android/node-contract/src/contractTest/java -name '*.java' -print | sort > "$RUNNER_TEMP/android-java-sources.txt"
          echo 'platform/android/app/src/main/java/dev/capyio/android/AndroidNativeCatalogRuntime.java' >> "$RUNNER_TEMP/android-java-sources.txt"
          timeout --signal=TERM --kill-after=10s 120s javac --release 17 -h "$RUNNER_TEMP/android-jni-headers" -d "$RUNNER_TEMP/android-contract-classes" @"$RUNNER_TEMP/android-java-sources.txt"
      - name: Check generated Java native names against Android exports
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_android_jni_exports.py'
          "$ANDROID_CONTRACT_NM" --defined-only --dynamic target/aarch64-linux-android/release/libcapyio_android_jni.so > "$RUNNER_TEMP/android-jni-exports.txt"
          python scripts/check_android_jni_exports.py "$RUNNER_TEMP/android-jni-headers/dev_capyio_android_AndroidNativeCatalogRuntime.h" "$RUNNER_TEMP/android-jni-exports.txt"
      - name: Run existing Java lifecycle and native LAN contracts
        run: |
          set -euo pipefail
          for main in dev.capyio.android.contract.AudioNodeContractTest dev.capyio.android.contract.CapabilityCatalogContractTest dev.capyio.android.contract.CapabilityLifecycleContractTest dev.capyio.android.lan.NativeLanContractTest; do
            timeout --signal=TERM --kill-after=10s 60s java -ea -Dcapyio.nativeLanFixture="$GITHUB_WORKSPACE/fixtures/audio/native_lan_v1_opus_single.hex" -cp "$RUNNER_TEMP/android-contract-classes" "$main"
          done

  pipewire-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install only official distro PipeWire tools in disposable runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pipewire-bin
          dpkg-query -W pipewire-bin libpipewire-0.3-modules libspa-0.2-modules
      - name: Validate pure signal oracle and fixture
        run: |
          python3 -m unittest discover -s scripts -p test_pipewire_loopback.py -v
          cargo test --locked -p capyio-linux-audio --example pipewire-pcm-fixture
      - name: Build production adapter fixture
        run: cargo build --locked -p capyio-linux-audio --example pipewire-pcm-fixture
      - name: Require actual isolated PipeWire PCM readback and cleanup
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 60s python3 scripts/run_pipewire_loopback.py \
            --hosted-pipewire-loopback --fixture target/debug/examples/pipewire-pcm-fixture \
            | tee "$RUNNER_TEMP/pipewire-loopback-result.txt"
          grep -Fx 'capyio_pipewire_loopback=passed real_graph=true ordered_pcm=true cleanup=true' \
            "$RUNNER_TEMP/pipewire-loopback-result.txt"
      - name: Build integrated Android-policy command fixture without executing IPC
        run: |
          set -euo pipefail
          cargo test --locked -p capyio-node --test linux_playback --no-run \
            --message-format=json > "$RUNNER_TEMP/pipewire-e2e-build.jsonl"
      - name: Require one integrated pinned-control UDP PipeWire and Stop run
        run: |
          set -euo pipefail
          fixture="$(python3 - "$RUNNER_TEMP/pipewire-e2e-build.jsonl" <<'PY'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items
                     if item.get('reason') == 'compiler-artifact'
                     and item.get('target', {}).get('name') == 'linux_playback'
                     and item.get('executable')]
          assert len(matches) == 1, 'exact integration executable required'
          print(matches[0])
          PY
          )"
          timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_loopback.py \
            --hosted-pipewire-loopback --e2e-fixture "$fixture" \
            | tee "$RUNNER_TEMP/pipewire-e2e-result.txt"
          grep -Fx 'capyio_pipewire_e2e=passed pinned_tls=true consent=true dynamic_udp=true real_graph=true stop=true cleanup=true' \
            "$RUNNER_TEMP/pipewire-e2e-result.txt"
