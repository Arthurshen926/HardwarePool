              playback) scenarios="waveform" ;;
              virtual_microphone) scenarios="waveform no_consumer child_exit server_disconnect" ;;
              capture) scenarios="waveform child_exit server_disconnect control_disconnect timeout" ;;
              virtual_speaker) scenarios="waveform no_input child_exit server_disconnect control_disconnect expiry" ;;
            esac
            for scenario in $scenarios; do
              case "$mode" in
                playback) args=(scripts/run_pipewire_loopback.py --hosted-pipewire-loopback --e2e-fixture "$playback") ;;
                virtual_microphone) args=(scripts/run_pipewire_loopback.py --hosted-pipewire-loopback --virtual-microphone-fixture "$playback" --virtual-microphone-scenario "$scenario") ;;
                capture) args=(scripts/run_pipewire_capture.py --hosted-pipewire-capture --fixture "$capture" --scenario "$scenario") ;;
