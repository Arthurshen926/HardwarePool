  android-compile-contracts:
    # Cross-compile and hardware-free contracts only. No APK signing/deployment,
    # SDK installation/license acceptance, device connection or credential use.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/setup@v1
        with:
          version: 11.5.3
          runtime: node@24
          cache: true
          install: false
      - name: Validate explicit Android finite media profile UI
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @capyio/desktop typecheck
          node --test scripts/android_camera_settings_ui.test.mjs scripts/android_microphone_settings_ui.test.mjs
      - name: Require preinstalled pinned NDK and JDK
        run: |
          set -euo pipefail
          ndk="${ANDROID_HOME:?Runner Android SDK path is missing}/ndk/29.0.14206865"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          jdk="${JAVA_HOME_17_X64:?Runner JDK 17 is missing}"
          for tool in "$bin/aarch64-linux-android29-clang" "$bin/llvm-ar" "$bin/llvm-nm" "$jdk/bin/javac" "$jdk/bin/java"; do
            test -x "$tool" || { echo 'Required preinstalled Android/JDK tool is missing; no install fallback.' >&2; exit 1; }
          done
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*29\.0\.14206865[[:space:]]*$' "$ndk/source.properties"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android29-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android29-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "ANDROID_CONTRACT_NM=$bin/llvm-nm"
            echo "JAVA_HOME=$jdk"
          } >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"
          "$jdk/bin/javac" -version
          "$bin/aarch64-linux-android29-clang" --version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - name: Compile actual Android JNI target and shared library
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 900s cargo build --locked --target aarch64-linux-android -p capyio-android-jni --release
          test -s target/aarch64-linux-android/release/libcapyio_android_jni.so
      - name: Compile dependency-free Java contracts and native declarations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-contract-classes" "$RUNNER_TEMP/android-jni-headers"
          find platform/android/node-contract/src/main/java platform/android/native-lan-contract/src/main/java platform/android/node-contract/src/contractTest/java platform/android/capyio-camera-app/camera-contract/src/main/java platform/android/capyio-camera-app/camera-contract/src/contractTest/java -name '*.java' -print | sort > "$RUNNER_TEMP/android-java-sources.txt"
          echo 'platform/android/app/src/main/java/dev/capyio/android/AndroidNativeCatalogRuntime.java' >> "$RUNNER_TEMP/android-java-sources.txt"
          timeout --signal=TERM --kill-after=10s 120s javac --release 17 -h "$RUNNER_TEMP/android-jni-headers" -d "$RUNNER_TEMP/android-contract-classes" @"$RUNNER_TEMP/android-java-sources.txt"
      - name: Compile production Android Java against existing SDK only
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?Runner Android SDK path is missing}"
          test -s "$sdk/platforms/android-36/android.jar" || { echo 'Preinstalled API 36 is required; no SDK install fallback.' >&2; exit 1; }
          test -d "$sdk/build-tools/36.0.0" || { echo 'Preinstalled build-tools 36.0.0 are required; no SDK install fallback.' >&2; exit 1; }
          # Compile source/resources only, not APK assembly/signing or capture.
          # JNI is cross-compiled above; web assets do not affect Java types.
          timeout --signal=TERM --kill-after=10s 600s bash platform/android/gradlew -p platform/android --no-daemon -Pandroid.builder.sdkDownload=false :app:compileDebugJavaWithJavac :app:capabilityCompositionTest :app:audioPeerContractTest :app:secureAudioContractTest -x syncSharedUi -x buildRustJni
      - name: Check generated Java native names against Android exports
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_android_jni_exports.py'
          "$ANDROID_CONTRACT_NM" --defined-only --dynamic target/aarch64-linux-android/release/libcapyio_android_jni.so > "$RUNNER_TEMP/android-jni-exports.txt"
          python scripts/check_android_jni_exports.py "$RUNNER_TEMP/android-jni-headers/dev_capyio_android_AndroidNativeCatalogRuntime.h" "$RUNNER_TEMP/android-jni-exports.txt"
      - name: Run existing Java lifecycle and native LAN contracts
        run: |
          set -euo pipefail
          for main in dev.capyio.android.contract.SecureMonoCaptureSessionContractTest dev.capyio.android.contract.AudioNodeContractTest dev.capyio.android.contract.CapabilityCatalogContractTest dev.capyio.android.contract.CapabilityLifecycleContractTest dev.capyio.android.lan.NativeLanContractTest dev.capyio.android.lan.NativeLanEndpointConcurrencyTest io.capyio.camera.contract.CaptureStateMachineContractTest io.capyio.camera.contract.SecureAvcSenderContractTest io.capyio.camera.contract.FiniteCameraAvcValidatorContractTest io.capyio.camera.contract.FiniteCameraEligibilityContractTest io.capyio.camera.contract.FiniteCameraTransformContractTest; do
            timeout --signal=TERM --kill-after=10s 60s java -ea -Dcapyio.nativeLanFixture="$GITHUB_WORKSPACE/fixtures/audio/native_lan_v1_opus_single.hex" -cp "$RUNNER_TEMP/android-contract-classes" "$main"
          done

      - name: Require actual finite camera orientation pixels on software EGL only
        run: |
          set -euo pipefail
          # Disposable hosted runner only. No Android device, display server or GPU access.
          python3 -m unittest discover -s scripts -p 'test_finite_camera_rotation_oracle.py'
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri
          timeout --signal=TERM --kill-after=5s 60s cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            scripts/native/finite_camera_rotation_oracle.c -o "$RUNNER_TEMP/finite-camera-rotation-oracle" \
            -lEGL -lGLESv2 -lm
          timeout --signal=TERM --kill-after=5s 120s python3 scripts/run_finite_camera_rotation_oracle.py \
            --hosted-software-only --classes "$RUNNER_TEMP/android-contract-classes" \
            --oracle "$RUNNER_TEMP/finite-camera-rotation-oracle" --artifacts "$RUNNER_TEMP/finite-camera-rotation" \
            | tee "$RUNNER_TEMP/finite-camera-rotation-results.txt"
          grep -Fx 'CAPYIO_FINITE_CAMERA_ROTATION_PIXELS_PASS cases=24 negative_controls=5 pixels=22118400 software=llvmpipe external_oes=true owned_cleanup=true' "$RUNNER_TEMP/finite-camera-rotation-results.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-finite-camera-rotation-evidence
          path: |
            ${{ runner.temp }}/finite-camera-rotation/**
            ${{ runner.temp }}/finite-camera-rotation-results.txt
          if-no-files-found: ignore

  pipewire-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install only official distro PipeWire tools in disposable runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pipewire-bin dbus-daemon
          dpkg-query -W pipewire-bin libpipewire-0.3-modules libspa-0.2-modules
      - name: Validate pure signal oracle and fixture
        run: |
          python3 -m unittest discover -s scripts -p test_pipewire_loopback.py -v
          cargo test --locked -p capyio-linux-audio --example pipewire-pcm-fixture
      - name: Build production adapter fixture
        run: cargo build --locked -p capyio-linux-audio --example pipewire-pcm-fixture
      - name: Require actual isolated PipeWire PCM readback and cleanup
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 60s python3 scripts/run_pipewire_loopback.py \
            --hosted-pipewire-loopback --fixture target/debug/examples/pipewire-pcm-fixture \
            | tee "$RUNNER_TEMP/pipewire-loopback-result.txt"
          grep -Fx 'capyio_pipewire_loopback=passed real_graph=true ordered_pcm=true cleanup=true' \
            "$RUNNER_TEMP/pipewire-loopback-result.txt"
      - name: Build integrated Android-policy command fixture without executing IPC
        run: |
          set -euo pipefail
          cargo build --locked -p capyio-node -p capyio-linux-console --features capyio-node/paired-store,capyio-linux-console/paired-store
          cargo test --locked -p capyio-node --features paired-store --test linux_playback --no-run \
            --message-format=json > "$RUNNER_TEMP/pipewire-e2e-build.jsonl"
      - name: Require one integrated pinned-control UDP PipeWire and Stop run
        run: |
          set -euo pipefail
          fixture="$(python3 - "$RUNNER_TEMP/pipewire-e2e-build.jsonl" <<'PY'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items
                     if item.get('reason') == 'compiler-artifact'
                     and item.get('target', {}).get('name') == 'linux_playback'
                     and item.get('executable')]
          assert len(matches) == 1, 'exact integration executable required'
          print(matches[0])
          PY
          )"
          timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_loopback.py \
            --hosted-pipewire-loopback --e2e-fixture "$fixture" \
            | tee "$RUNNER_TEMP/pipewire-e2e-result.txt"
          grep -Fx 'capyio_pipewire_e2e=passed pinned_tls=true consent=true dynamic_udp=true real_graph=true stop=true cleanup=true' \
            "$RUNNER_TEMP/pipewire-e2e-result.txt"
      - name: Require direct virtual microphone waveform and bounded failure cleanup
        run: |
          set -euo pipefail
          fixture="$(python3 - "$RUNNER_TEMP/pipewire-e2e-build.jsonl" <<'PY'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items
                     if item.get('reason') == 'compiler-artifact'
                     and item.get('target', {}).get('name') == 'linux_playback'
                     and item.get('executable')]
          assert len(matches) == 1, 'exact integration executable required'
          print(matches[0])
          PY
          )"
          for scenario in waveform no_consumer child_exit server_disconnect; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_loopback.py \
              --hosted-pipewire-loopback --virtual-microphone-fixture "$fixture" \
              --virtual-microphone-scenario "$scenario" \
              | tee "$RUNNER_TEMP/pipewire-virtual-microphone-$scenario-result.txt"
            grep -Fx "capyio_pipewire_virtual_microphone=passed scenario=$scenario pinned_tls=true consent=true dynamic_udp=true real_source=true stop=true cleanup=true" \
              "$RUNNER_TEMP/pipewire-virtual-microphone-$scenario-result.txt"
          done
      - name: Validate pure stereo capture signal and graph isolation oracle
        run: python3 -m unittest discover -s scripts -p test_pipewire_capture.py -v
      - name: Build Linux-to-Android stereo capture command fixture without executing IPC
        run: |
          set -euo pipefail
          cargo test --locked -p capyio-node --features paired-store --test linux_capture --no-run \
            --message-format=json > "$RUNNER_TEMP/pipewire-capture-build.jsonl"
      - name: Require isolated stereo capture waveform and lifecycle failure cleanup
        run: |
          set -euo pipefail
          fixture="$(python3 - "$RUNNER_TEMP/pipewire-capture-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items
                     if item.get('reason') == 'compiler-artifact'
                     and item.get('target', {}).get('name') == 'linux_capture'
                     and item.get('executable')]
          assert len(matches) == 1, 'exact capture integration executable required'
          print(matches[0])
          PYFIXTURE
          )"
          for scenario in waveform child_exit server_disconnect control_disconnect timeout; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_capture.py \
              --hosted-pipewire-capture --fixture "$fixture" --scenario "$scenario" \
              | tee "$RUNNER_TEMP/pipewire-capture-$scenario-result.txt"
            grep -Fx "capyio_pipewire_capture=passed scenario=$scenario pinned_tls=true independent_consent=true stereo=true real_graph=true simulated_app=true stop=true cleanup=true" \
              "$RUNNER_TEMP/pipewire-capture-$scenario-result.txt"
          done
      - name: Require actual owned virtual speaker input and independent application routing
        run: |
          set -euo pipefail
          fixture="$(python3 - "$RUNNER_TEMP/pipewire-capture-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items
                     if item.get('reason') == 'compiler-artifact'
                     and item.get('target', {}).get('name') == 'linux_capture'
                     and item.get('executable')]
          assert len(matches) == 1, 'exact virtual speaker integration executable required'
          print(matches[0])
          PYFIXTURE
          )"
          for scenario in waveform no_input child_exit server_disconnect control_disconnect expiry; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_capture.py \
              --hosted-pipewire-capture --fixture "$fixture" --endpoint-mode virtual_speaker \
              --scenario "$scenario" \
              | tee "$RUNNER_TEMP/pipewire-virtual-speaker-$scenario-result.txt"
            grep -Fx "capyio_pipewire_virtual_speaker=passed scenario=$scenario pinned_tls=true independent_consent=true dynamic_udp=true stereo=true real_sink=true simulated_app=true environment_sanitized=true stop=true cleanup=true" \
              "$RUNNER_TEMP/pipewire-virtual-speaker-$scenario-result.txt"
          done
      - name: Require paired IncomingDraft independent approval and finite Source lease
        run: |
          set -euo pipefail
          test_name=incoming_draft::ipc_linux_incoming_paired_store_requires_independent_local_approval
          timeout --signal=TERM --kill-after=5s 60s cargo test --locked -p capyio-node --features paired-store --test linux_playback "$test_name" -- --exact --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/audio-paired-incoming.txt"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/audio-paired-incoming.txt"
          grep -F 'capyio_audio_paired_store=passed protected_read=true secret_redacted=true' "$RUNNER_TEMP/audio-paired-incoming.txt"
      - name: Require all sixteen paired-store audio graph scenarios without skips
        run: |
          set -euo pipefail
          playback="$(python3 - "$RUNNER_TEMP/pipewire-e2e-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'linux_playback' and item.get('executable')]
          assert len(matches) == 1
          print(matches[0])
          PYFIXTURE
          )"
          capture="$(python3 - "$RUNNER_TEMP/pipewire-capture-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'linux_capture' and item.get('executable')]
          assert len(matches) == 1
          print(matches[0])
          PYFIXTURE
          )"
          count=0
          for mode in playback virtual_microphone capture virtual_speaker; do
            case "$mode" in
              playback) scenarios="waveform" ;;
              virtual_microphone) scenarios="waveform no_consumer child_exit server_disconnect" ;;
              capture) scenarios="waveform child_exit server_disconnect control_disconnect timeout" ;;
              virtual_speaker) scenarios="waveform no_input child_exit server_disconnect control_disconnect expiry" ;;
            esac
            for scenario in $scenarios; do
              case "$mode" in
                playback) args=(scripts/run_pipewire_loopback.py --hosted-pipewire-loopback --e2e-fixture "$playback") ;;
                virtual_microphone) args=(scripts/run_pipewire_loopback.py --hosted-pipewire-loopback --virtual-microphone-fixture "$playback" --virtual-microphone-scenario "$scenario") ;;
                capture) args=(scripts/run_pipewire_capture.py --hosted-pipewire-capture --fixture "$capture" --scenario "$scenario") ;;
                virtual_speaker) args=(scripts/run_pipewire_capture.py --hosted-pipewire-capture --fixture "$capture" --endpoint-mode virtual_speaker --scenario "$scenario") ;;
              esac
              timeout --signal=TERM --kill-after=15s 75s python3 "${args[@]}" --paired-store | tee "$RUNNER_TEMP/audio-paired-$mode-$scenario.txt"
              grep -Fx "capyio_audio_paired_graph=passed mode=$mode scenario=$scenario protected_read=true cleanup=true" "$RUNNER_TEMP/audio-paired-$mode-$scenario.txt"
              count=$((count + 1))
            done
          done
          test "$count" -eq 16

      - name: Require sixteen actual-console playback and virtual-microphone graph profiles
        run: |
          set -euo pipefail
          playback="$(python3 - "$RUNNER_TEMP/pipewire-e2e-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'linux_playback' and item.get('executable')]
          assert len(matches) == 1
          print(matches[0])
          PYFIXTURE
          )"
          "$playback" --list | tee "$RUNNER_TEMP/console-playback-tests.txt"
          grep -Fx 'hosted_console_playback_end_to_end: test' "$RUNNER_TEMP/console-playback-tests.txt"
          grep -Fx 'hosted_console_virtual_microphone_end_to_end: test' "$RUNNER_TEMP/console-playback-tests.txt"
          count=0
          for mode in playback virtual_microphone; do
            for scenario in waveform no_approval pretyped mismatched_request mismatched_route mismatched_peer expiry remote_eof; do
              case "$mode" in
                playback) args=(--e2e-fixture "$playback") ;;
                virtual_microphone) args=(--virtual-microphone-fixture "$playback" --virtual-microphone-scenario waveform) ;;
              esac
              timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_loopback.py \
                --hosted-pipewire-loopback "${args[@]}" --paired-store --console --console-scenario "$scenario" \
                | tee "$RUNNER_TEMP/console-$mode-$scenario.txt"
              grep -Fx "capyio_audio_console_graph=passed mode=$mode scenario=$scenario actual_console=true protected_read=true independent_graph=true cleanup=true" "$RUNNER_TEMP/console-$mode-$scenario.txt"
              count=$((count + 1))
            done
          done
          test "$count" -eq 16

      - name: Require sixteen actual-console capture and virtual-speaker graph profiles
        run: |
          set -euo pipefail
          capture="$(python3 - "$RUNNER_TEMP/pipewire-capture-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'linux_capture' and item.get('executable')]
          assert len(matches) == 1
          print(matches[0])
          PYFIXTURE
          )"
          "$capture" --list | tee "$RUNNER_TEMP/console-capture-tests.txt"
          grep -Fx 'hosted_console_capture_end_to_end: test' "$RUNNER_TEMP/console-capture-tests.txt"
          grep -Fx 'hosted_console_virtual_speaker_end_to_end: test' "$RUNNER_TEMP/console-capture-tests.txt"
          count=0
          for mode in capture virtual_speaker; do
            case "$mode" in
              capture) endpoint=selected_source ;;
              virtual_speaker) endpoint=virtual_speaker ;;
            esac
            for scenario in waveform no_approval pretyped mismatched_request mismatched_route mismatched_peer expiry remote_eof; do
              timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_capture.py \
                --hosted-pipewire-capture --fixture "$capture" --endpoint-mode "$endpoint" --scenario waveform \
                --paired-store --console --console-scenario "$scenario" \
                | tee "$RUNNER_TEMP/console-$mode-$scenario.txt"
              grep -Fx "capyio_audio_console_graph=passed mode=$mode scenario=$scenario actual_console=true protected_read=true independent_graph=true cleanup=true" "$RUNNER_TEMP/console-$mode-$scenario.txt"
              count=$((count + 1))
            done
          done
          test "$count" -eq 16

      - name: Require finite pinned TLS mono audio and independent PipeWire readback
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_pipewire_secure_audio.py -v
          cargo test --locked -p capyio-node --test linux_secure_audio --no-run --message-format=json \
            > "$RUNNER_TEMP/secure-audio-build.jsonl"
          fixture="$(python3 - "$RUNNER_TEMP/secure-audio-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'linux_secure_audio' and item.get('executable')]
          assert len(matches) == 1
          print(matches[0])
          PYFIXTURE
          )"
          "$fixture" --list | tee "$RUNNER_TEMP/secure-audio-tests.txt"
          grep -Fx 'hosted_secure_audio_android_sender_graph: test' "$RUNNER_TEMP/secure-audio-tests.txt"
          count=0
          for scenario in waveform stop source_revoke sink_revoke expiry control_eof media_eof no_authority peer_denied; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_secure_audio.py \
              --hosted-private-secure-audio --fixture "$fixture" --scenario "$scenario" \
              | tee "$RUNNER_TEMP/secure-audio-$scenario.txt"
            grep -Fx "capyio_pipewire_secure_audio=passed scenario=$scenario surface=reusable_rust_apis capture=synthetic real_graph=true owned_cleanup=true" "$RUNNER_TEMP/secure-audio-$scenario.txt"
            count=$((count + 1))
          done
          test "$count" -eq 9
      - name: Require actual secure playback terminal Node and private PipeWire proof
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_pipewire_secure_console.py -v
          cargo build --locked -p capyio-node -p capyio-linux-console --features capyio-node/paired-store,capyio-linux-console/paired-store
          cargo test --locked -p capyio-node --features paired-store --test linux_secure_audio --no-run --message-format=json \
            > "$RUNNER_TEMP/secure-console-build.jsonl"
          fixture="$(python3 - "$RUNNER_TEMP/secure-console-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'linux_secure_audio' and item.get('executable')]
          assert len(matches) == 1
          print(matches[0])
          PYFIXTURE
          )"
          "$fixture" --list | tee "$RUNNER_TEMP/secure-console-tests.txt"
          grep -Fx 'secure_console::hosted_secure_audio_console_graph: test' "$RUNNER_TEMP/secure-console-tests.txt"
          "$fixture" --exact secure_console::pure_secure_console_expiry_fits_existing_checkpoint_without_shortening_waveform \
            --test-threads=1 --color never | tee "$RUNNER_TEMP/secure-console-budget.txt"
          grep -Fx 'test secure_console::pure_secure_console_expiry_fits_existing_checkpoint_without_shortening_waveform ... ok' "$RUNNER_TEMP/secure-console-budget.txt"
          count=0
          for scenario in stop no_approval pretyped wrong_request wrong_route wrong_peer source_revoke expiry control_eof media_eof local_eof; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_secure_console.py \
              --hosted-private-secure-console --fixture "$fixture" --scenario "$scenario" 2>&1 \
              | tee "$RUNNER_TEMP/secure-console-$scenario.txt"
            grep -Fx "capyio_pipewire_secure_console=passed scenario=$scenario surface=production_console capture=synthetic real_graph=true owned_cleanup=true" "$RUNNER_TEMP/secure-console-$scenario.txt"
            count=$((count + 1))
          done
          test "$count" -eq 11
          count=0
          for scenario in stop no_approval pretyped wrong_request wrong_route wrong_peer source_revoke expiry control_eof media_eof local_eof; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_secure_console.py \
              --hosted-private-secure-console --fixture "$fixture" --scenario "$scenario" \
              --endpoint-mode virtual_microphone 2>&1 \
              | tee "$RUNNER_TEMP/secure-console-virtual-microphone-$scenario.txt"
            grep -Fx "capyio_pipewire_secure_console=passed scenario=$scenario endpoint_mode=virtual_microphone surface=production_console capture=synthetic real_graph=true owned_cleanup=true" "$RUNNER_TEMP/secure-console-virtual-microphone-$scenario.txt"
            count=$((count + 1))
          done
          test "$count" -eq 11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-secure-playback-console-evidence
          path: ${{ runner.temp }}/secure-console-*.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-secure-audio-evidence
          path: ${{ runner.temp }}/secure-audio-*.txt
          if-no-files-found: ignore

  linux-native-camera:
    # Optional native dependency only in this disposable official Ubuntu runner.
    # No physical camera, portal, user session, V4L2 or kernel module is used.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install official optional native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pipewire-bin libpipewire-0.3-dev libspa-0.2-dev pkg-config build-essential
          dpkg-query -W pipewire-bin libpipewire-0.3-dev libspa-0.2-dev
      - name: Require portable owner and native boundary checks
        run: |
          set -euo pipefail
          cargo test --locked -p capyio-linux-camera
          cargo clippy --locked -p capyio-linux-camera --all-targets --features native-pipewire -- -D warnings
          native=platform/linux/capyio-camera/native
          cc -std=c11 -Wall -Wextra -Werror "$native/test_protocol.c" -o "$RUNNER_TEMP/camera-protocol"
          "$RUNNER_TEMP/camera-protocol"
          cc -std=gnu11 -Wall -Wextra -Werror $(pkg-config --cflags libpipewire-0.3) "$native/test_helper.c" $(pkg-config --libs libpipewire-0.3) -o "$RUNNER_TEMP/camera-helper-tests"
          "$RUNNER_TEMP/camera-helper-tests"
          cc -std=gnu11 -Wall -Wextra -Werror $(pkg-config --cflags libpipewire-0.3) "$native/test_consumer.c" $(pkg-config --libs libpipewire-0.3) -o "$RUNNER_TEMP/camera-consumer-tests"
          "$RUNNER_TEMP/camera-consumer-tests"
          python3 -m unittest discover -s scripts -p test_pipewire_camera.py -v
      - name: Build production owner helper and independent native pixel consumer
        run: |
          set -euo pipefail
          cargo build --locked -p capyio-linux-camera --features native-pipewire --bins --examples
          # Acceptance example lives in examples; install its exact packaged sibling.
          cp target/debug/capyio-linux-camera-helper target/debug/examples/capyio-linux-camera-helper
          cc -std=gnu11 -O2 -Wall -Wextra -Werror $(pkg-config --cflags libpipewire-0.3) platform/linux/capyio-camera/native/camera_consumer.c $(pkg-config --libs libpipewire-0.3) -o "$RUNNER_TEMP/camera-consumer"
      - name: Require actual NV12 pixels ownership and bounded lifecycle cleanup
        run: |
          set -euo pipefail
          for scenario in pixels no_consumer expiry child_exit server_disconnect malformed partial; do
            timeout --signal=TERM --kill-after=10s 45s python3 scripts/run_pipewire_camera.py \
              --hosted-private-camera --driver target/debug/examples/camera_graph_driver \
              --helper target/debug/examples/capyio-linux-camera-helper \
              --consumer "$RUNNER_TEMP/camera-consumer" --scenario "$scenario" \
              | tee "$RUNNER_TEMP/camera-$scenario-result.txt"
            grep -Fx "capyio_pipewire_camera=passed scenario=$scenario real_graph=true owned_cleanup=true" "$RUNNER_TEMP/camera-$scenario-result.txt"
          done
