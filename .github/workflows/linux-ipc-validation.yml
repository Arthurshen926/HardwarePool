name: Linux IPC validation

# Experimental, hardware-free validation only. No default-branch or PR trigger.
on:
  push:
    branches: [codex/linux-ipc-validation-20261019]

permissions:
  contents: read

concurrency:
  group: linux-ipc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ipc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Linux host, node and mock adapters
        run: cargo clippy --locked -p capyio-mock-source -p capyio-mock-sink -p capyio-linux-host -p capyio-node -p capyio-linux-audio -p capyio-native-audio-lan -p capyio-control-tls -p capyio-control-link -p capyio-core -p capyio-runtime -p capyio-android-jni -p capyio-protocol --all-targets -- -D warnings
      - name: Build repository mock adapters
        run: cargo build --locked -p capyio-mock-source -p capyio-mock-sink
      - name: Require finite IPC regression tests
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/required-ipc-tests.txt" <<'TESTS'
          payload::tests::parser_consumes_exact_fixture_and_validates_receipt
          payload::tests::parser_rejects_wrong_identity_epoch_profile_and_corruption
          payload::tests::endpoint_contract_and_private_directory_are_required
          payload::tests::separate_socket_transfer_and_bound_receipt
          payload::tests::missing_sink_and_sender_have_bounded_failures
          payload::tests::oversized_datagram_is_not_accepted_after_truncation
          payload_requires_explicit_lifecycle_opt_in
          payload_crosses_real_children_once_per_epoch_and_cleans_on_every_exit
          payload::tests::batch_parser_orders_all_records_and_binds_complete_receipt
          payload::tests::batch_parser_rejects_gaps_replay_binding_timing_and_partial_completion
          payload::tests::batch_queue_overflow_is_transactional_without_eviction
          payload::tests::batch_separate_socket_transfer_and_complete_receipt
          payload::tests::batch_paced_partial_sender_cannot_renew_whole_transfer_budget
          payload::tests::batch_saturated_kernel_queue_bounds_source_failure_and_cleans_endpoint
          payload::tests::batch_missing_partial_and_oversized_input_fail_within_budget
          mock_routes::tests::batch_faults_drop_both_children_and_remove_owned_directory
          batch_requires_opt_in_and_rejects_payload_conflict
          batch_crosses_real_children_once_per_epoch_and_cleans_on_every_exit
          tests::owner_stdin_eof_byte_or_error_requests_stop
          tests::launch_requires_explicit_lab_addresses_target_and_finite_duration
