          stereo_job::tests::hosted::ipc_stereo_job_ack_queued_before_stop_or_revoke_never_publishes_acceptance
          stereo_job::tests::hosted::ipc_stereo_job_control_generation_loss_and_mutated_lease_close_admission
          stereo_job::tests::hosted::ipc_stereo_job_original_lease_expiry_cannot_be_renewed_by_bound_readiness
