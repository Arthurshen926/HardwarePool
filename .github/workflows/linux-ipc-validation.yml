            > "$RUNNER_TEMP/secure-stereo-build.jsonl"
          fixture="$(python3 - "$RUNNER_TEMP/secure-stereo-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'linux_secure_stereo' and item.get('executable')]
          assert len(matches) == 1
          print(matches[0])
          PYFIXTURE
          )"
          "$fixture" --list | tee "$RUNNER_TEMP/secure-stereo-tests.txt"
          grep -Fx 'hosted_secure_stereo_linux_capture_android_sink: test' "$RUNNER_TEMP/secure-stereo-tests.txt"
          count=0
          for scenario in waveform stop source_revoke sink_revoke control_eof media_eof expiry backpressure partial_write; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_secure_stereo.py \
              --hosted-pipewire-secure-stereo --fixture "$fixture" --scenario "$scenario" \
              2>&1 | tee "$RUNNER_TEMP/secure-stereo-$scenario.txt"
            grep -Fx "capyio_pipewire_secure_stereo=passed scenario=$scenario pinned_tls=true independent_consent=true exact_claims=true stereo=true actual_rust_apis=true simulated_sink=true cleanup=true" "$RUNNER_TEMP/secure-stereo-$scenario.txt"
            count=$((count + 1))
          done
          test "$count" -eq 9
          grep -Fx 'hosted_secure_stereo_linux_capture_android_receive_job: test' "$RUNNER_TEMP/secure-stereo-tests.txt"
          count=0
          for scenario in waveform partial_ack; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_secure_stereo.py \
              --hosted-pipewire-secure-stereo-job --fixture "$fixture" --scenario "$scenario" \
              2>&1 | tee "$RUNNER_TEMP/secure-stereo-job-$scenario.txt"
            grep -Fx "capyio_pipewire_secure_stereo_job=passed scenario=$scenario pinned_tls=true independent_consent=true exact_claims=true stereo=true shared_runtime=true actual_write_ack=true worker_confirmed=true simulated_sink=true route_starting=true cleanup=true" "$RUNNER_TEMP/secure-stereo-job-$scenario.txt"
            count=$((count + 1))
          done
          test "$count" -eq 2
      - name: Require actual secure playback terminal Node and private PipeWire proof
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_pipewire_secure_console.py -v
          cargo build --locked -p capyio-node -p capyio-linux-console --features capyio-node/paired-store,capyio-linux-console/paired-store
          cargo test --locked -p capyio-node --features paired-store --test linux_secure_audio --no-run --message-format=json \
            > "$RUNNER_TEMP/secure-console-build.jsonl"
          fixture="$(python3 - "$RUNNER_TEMP/secure-console-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'linux_secure_audio' and item.get('executable')]
          assert len(matches) == 1
          print(matches[0])
          PYFIXTURE
          )"
          "$fixture" --list | tee "$RUNNER_TEMP/secure-console-tests.txt"
          grep -Fx 'secure_console::hosted_secure_audio_console_graph: test' "$RUNNER_TEMP/secure-console-tests.txt"
          "$fixture" --exact secure_console::pure_secure_console_expiry_fits_existing_checkpoint_without_shortening_waveform \
            --test-threads=1 --color never | tee "$RUNNER_TEMP/secure-console-budget.txt"
          grep -Fx 'test secure_console::pure_secure_console_expiry_fits_existing_checkpoint_without_shortening_waveform ... ok' "$RUNNER_TEMP/secure-console-budget.txt"
          count=0
          for scenario in stop no_approval pretyped wrong_request wrong_route wrong_peer source_revoke expiry control_eof media_eof local_eof; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_secure_console.py \
              --hosted-private-secure-console --fixture "$fixture" --scenario "$scenario" 2>&1 \
              | tee "$RUNNER_TEMP/secure-console-$scenario.txt"
            grep -Fx "capyio_pipewire_secure_console=passed scenario=$scenario surface=production_console capture=synthetic real_graph=true owned_cleanup=true" "$RUNNER_TEMP/secure-console-$scenario.txt"
            count=$((count + 1))
          done
          test "$count" -eq 11
          count=0
          for scenario in stop no_approval pretyped wrong_request wrong_route wrong_peer source_revoke expiry control_eof media_eof local_eof; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_secure_console.py \
              --hosted-private-secure-console --fixture "$fixture" --scenario "$scenario" \
              --endpoint-mode virtual_microphone 2>&1 \
              | tee "$RUNNER_TEMP/secure-console-virtual-microphone-$scenario.txt"
            grep -Fx "capyio_pipewire_secure_console=passed scenario=$scenario endpoint_mode=virtual_microphone surface=production_console capture=synthetic real_graph=true owned_cleanup=true" "$RUNNER_TEMP/secure-console-virtual-microphone-$scenario.txt"
            count=$((count + 1))
          done
          test "$count" -eq 11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-secure-playback-console-evidence
          path: ${{ runner.temp }}/secure-console-*.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-secure-audio-evidence
          path: ${{ runner.temp }}/secure-audio-*.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-secure-stereo-api-evidence
          path: ${{ runner.temp }}/secure-stereo-*.txt
          if-no-files-found: ignore

  linux-native-camera:
    # Optional native dependency only in this disposable official Ubuntu runner.
    # No physical camera, portal, user session, V4L2 or kernel module is used.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install official optional native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pipewire-bin libpipewire-0.3-dev libspa-0.2-dev pkg-config build-essential
          dpkg-query -W pipewire-bin libpipewire-0.3-dev libspa-0.2-dev
      - name: Require portable owner and native boundary checks
        run: |
          set -euo pipefail
          cargo test --locked -p capyio-linux-camera
          cargo clippy --locked -p capyio-linux-camera --all-targets --features native-pipewire -- -D warnings
          native=platform/linux/capyio-camera/native
          cc -std=c11 -Wall -Wextra -Werror "$native/test_protocol.c" -o "$RUNNER_TEMP/camera-protocol"
          "$RUNNER_TEMP/camera-protocol"
          cc -std=gnu11 -Wall -Wextra -Werror $(pkg-config --cflags libpipewire-0.3) "$native/test_helper.c" $(pkg-config --libs libpipewire-0.3) -o "$RUNNER_TEMP/camera-helper-tests"
          "$RUNNER_TEMP/camera-helper-tests"
          cc -std=gnu11 -Wall -Wextra -Werror $(pkg-config --cflags libpipewire-0.3) "$native/test_consumer.c" $(pkg-config --libs libpipewire-0.3) -o "$RUNNER_TEMP/camera-consumer-tests"
          "$RUNNER_TEMP/camera-consumer-tests"
          python3 -m unittest discover -s scripts -p test_pipewire_camera.py -v
      - name: Build production owner helper and independent native pixel consumer
        run: |
          set -euo pipefail
          cargo build --locked -p capyio-linux-camera --features native-pipewire --bins --examples
          # Acceptance example lives in examples; install its exact packaged sibling.
          cp target/debug/capyio-linux-camera-helper target/debug/examples/capyio-linux-camera-helper
          cc -std=gnu11 -O2 -Wall -Wextra -Werror $(pkg-config --cflags libpipewire-0.3) platform/linux/capyio-camera/native/camera_consumer.c $(pkg-config --libs libpipewire-0.3) -o "$RUNNER_TEMP/camera-consumer"
      - name: Require actual NV12 pixels ownership and bounded lifecycle cleanup
        run: |
          set -euo pipefail
          for scenario in pixels no_consumer expiry child_exit server_disconnect malformed partial; do
            timeout --signal=TERM --kill-after=10s 45s python3 scripts/run_pipewire_camera.py \
              --hosted-private-camera --driver target/debug/examples/camera_graph_driver \
              --helper target/debug/examples/capyio-linux-camera-helper \
              --consumer "$RUNNER_TEMP/camera-consumer" --scenario "$scenario" \
              | tee "$RUNNER_TEMP/camera-$scenario-result.txt"
            grep -Fx "capyio_pipewire_camera=passed scenario=$scenario real_graph=true owned_cleanup=true" "$RUNNER_TEMP/camera-$scenario-result.txt"
          done

  secure-audio-long-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install official tools for isolated long audio graphs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pipewire-bin dbus-daemon
          dpkg-query -W pipewire-bin libpipewire-0.3-modules libspa-0.2-modules
      - name: Validate bounded late-window signal oracle
        run: python3 -m unittest discover -s scripts -p test_pipewire_secure_console_long.py -v
      - name: Build actual paired Node and console with long fixture
        run: |
          set -euo pipefail
          test "$(df --output=avail -B1 . | tail -1)" -ge 4294967296
          cargo build --locked -p capyio-node -p capyio-linux-console --features capyio-node/paired-store,capyio-linux-console/paired-store
          cargo test --locked -p capyio-node --features paired-store --test linux_secure_audio --no-run \
            --message-format=json > "$RUNNER_TEMP/secure-long-build.jsonl"
          cargo test --locked -p capyio-node --features paired-store --test linux_secure_audio \
            secure_console_long::pure_long_console_profile_is_separate_and_finite -- --exact
      - name: Require late physical Stop and full five-minute virtual approval expiry
        run: |
          set -euo pipefail
          fixture="$(python3 - "$RUNNER_TEMP/secure-long-build.jsonl" <<'PY'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items
                     if item.get('reason') == 'compiler-artifact'
                     and item.get('target', {}).get('name') == 'linux_secure_audio'
                     and item.get('executable')]
          assert len(matches) == 1, 'exact long integration executable required'
          print(matches[0])
          PY
          )"
          "$fixture" --list | tee "$RUNNER_TEMP/secure-long-tests.txt"
          grep -Fx 'secure_console_long::hosted_secure_audio_console_long_graph: test' "$RUNNER_TEMP/secure-long-tests.txt"
          timeout --signal=TERM --kill-after=15s 360s python3 scripts/run_pipewire_secure_console_long.py \
            --hosted-private-secure-console-long --fixture "$fixture" --scenario stop --endpoint-mode playback 2>&1 \
            | tee "$RUNNER_TEMP/secure-long-stop.txt"
          grep -Fx 'capyio_pipewire_secure_console_long=passed scenario=stop endpoint_mode=playback profile=pinned_tls13_mono_300s_v1 requested_seconds=300 surface=production_console capture=synthetic real_graph=true late_after_60s=true stop_after_75s=true post_terminal_silence=true owned_cleanup=true' "$RUNNER_TEMP/secure-long-stop.txt"
          timeout --signal=TERM --kill-after=15s 360s python3 scripts/run_pipewire_secure_console_long.py \
            --hosted-private-secure-console-long --fixture "$fixture" --scenario expiry --endpoint-mode virtual_microphone 2>&1 \
            | tee "$RUNNER_TEMP/secure-long-expiry.txt"
          grep -Fx 'capyio_pipewire_secure_console_long=passed scenario=expiry endpoint_mode=virtual_microphone profile=pinned_tls13_mono_300s_v1 requested_seconds=300 surface=production_console capture=synthetic real_graph=true late_after_60s=true near_original_expiry=true original_expiry_observed=true post_terminal_silence=true owned_cleanup=true' "$RUNNER_TEMP/secure-long-expiry.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-long-secure-audio-evidence
          path: ${{ runner.temp }}/secure-long-*.txt
          if-no-files-found: ignore
