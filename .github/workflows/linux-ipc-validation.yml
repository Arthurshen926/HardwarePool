            grep -Fx "capyio_pipewire_capture=passed scenario=$scenario pinned_tls=true independent_consent=true stereo=true real_graph=true simulated_app=true stop=true cleanup=true" \
              "$RUNNER_TEMP/pipewire-capture-$scenario-result.txt"
          done
      - name: Require actual owned virtual speaker input and independent application routing
        run: |
          set -euo pipefail
          fixture="$(python3 - "$RUNNER_TEMP/pipewire-capture-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items
