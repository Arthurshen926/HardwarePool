  android-compile-contracts:
    # Cross-compile and hardware-free contracts only. No APK signing/deployment,
    # SDK installation/license acceptance, device connection or credential use.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/setup@v1
        with:
          version: 11.5.3
          runtime: node@24
          cache: true
          install: false
      - name: Validate explicit Android finite media profile UI
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @capyio/desktop typecheck
          node --test scripts/android_camera_settings_ui.test.mjs scripts/android_microphone_settings_ui.test.mjs scripts/remote_resource_support.test.mjs scripts/resource_card_render.test.mjs scripts/audio_catalog_selection_ui.test.mjs scripts/media_refresh_order.test.mjs
      - name: Require preinstalled pinned NDK and JDK
        run: |
          set -euo pipefail
          ndk="${ANDROID_HOME:?Runner Android SDK path is missing}/ndk/29.0.14206865"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          jdk="${JAVA_HOME_17_X64:?Runner JDK 17 is missing}"
          for tool in "$bin/aarch64-linux-android29-clang" "$bin/llvm-ar" "$bin/llvm-nm" "$jdk/bin/javac" "$jdk/bin/java"; do
            test -x "$tool" || { echo 'Required preinstalled Android/JDK tool is missing; no install fallback.' >&2; exit 1; }
          done
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*29\.0\.14206865[[:space:]]*$' "$ndk/source.properties"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android29-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android29-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "ANDROID_CONTRACT_NM=$bin/llvm-nm"
            echo "JAVA_HOME=$jdk"
          } >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"
          "$jdk/bin/javac" -version
          "$bin/aarch64-linux-android29-clang" --version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - name: Compile actual Android JNI target and shared library
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 900s cargo build --locked --target aarch64-linux-android -p capyio-android-jni --release
          test -s target/aarch64-linux-android/release/libcapyio_android_jni.so
      - name: Compile dependency-free Java contracts and native declarations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-contract-classes" "$RUNNER_TEMP/android-jni-headers"
          find platform/android/node-contract/src/main/java platform/android/native-lan-contract/src/main/java platform/android/node-contract/src/contractTest/java platform/android/capyio-camera-app/camera-contract/src/main/java platform/android/capyio-camera-app/camera-contract/src/contractTest/java -name '*.java' -print | sort > "$RUNNER_TEMP/android-java-sources.txt"
          echo 'platform/android/app/src/main/java/dev/capyio/android/AndroidNativeCatalogRuntime.java' >> "$RUNNER_TEMP/android-java-sources.txt"
          timeout --signal=TERM --kill-after=10s 120s javac --release 17 -h "$RUNNER_TEMP/android-jni-headers" -d "$RUNNER_TEMP/android-contract-classes" @"$RUNNER_TEMP/android-java-sources.txt"
      - name: Compile production Android Java against existing SDK only
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?Runner Android SDK path is missing}"
          test -s "$sdk/platforms/android-36/android.jar" || { echo 'Preinstalled API 36 is required; no SDK install fallback.' >&2; exit 1; }
          test -d "$sdk/build-tools/36.0.0" || { echo 'Preinstalled build-tools 36.0.0 are required; no SDK install fallback.' >&2; exit 1; }
          # Compile source/resources only, not APK assembly/signing or capture.
          # JNI is cross-compiled above; web assets do not affect Java types.
          timeout --signal=TERM --kill-after=10s 600s bash platform/android/gradlew -p platform/android --no-daemon -Pandroid.builder.sdkDownload=false :app:compileDebugJavaWithJavac :app:capabilityCompositionTest :app:audioPeerContractTest :app:secureAudioContractTest -x syncSharedUi -x buildRustJni
      - name: Check generated Java native names against Android exports
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_android_jni_exports.py'
          "$ANDROID_CONTRACT_NM" --defined-only --dynamic target/aarch64-linux-android/release/libcapyio_android_jni.so > "$RUNNER_TEMP/android-jni-exports.txt"
          python scripts/check_android_jni_exports.py "$RUNNER_TEMP/android-jni-headers/dev_capyio_android_AndroidNativeCatalogRuntime.h" "$RUNNER_TEMP/android-jni-exports.txt"
      - name: Run existing Java lifecycle and native LAN contracts
        run: |
          set -euo pipefail
          for main in dev.capyio.android.contract.SecureMonoCaptureSessionContractTest dev.capyio.android.contract.AudioNodeContractTest dev.capyio.android.contract.CapabilityCatalogContractTest dev.capyio.android.contract.CapabilityLifecycleContractTest dev.capyio.android.lan.NativeLanContractTest dev.capyio.android.lan.NativeLanEndpointConcurrencyTest io.capyio.camera.contract.CaptureStateMachineContractTest io.capyio.camera.contract.SecureAvcSenderContractTest io.capyio.camera.contract.FiniteCameraAvcValidatorContractTest io.capyio.camera.contract.FiniteCameraEligibilityContractTest io.capyio.camera.contract.FiniteCameraTransformContractTest; do
            timeout --signal=TERM --kill-after=10s 60s java -ea -Dcapyio.nativeLanFixture="$GITHUB_WORKSPACE/fixtures/audio/native_lan_v1_opus_single.hex" -cp "$RUNNER_TEMP/android-contract-classes" "$main"
          done

      - name: Require actual finite camera orientation pixels on software EGL only
        run: |
          set -euo pipefail
          # Disposable hosted runner only. No Android device, display server or GPU access.
          python3 -m unittest discover -s scripts -p 'test_finite_camera_rotation_oracle.py'
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri
          timeout --signal=TERM --kill-after=5s 60s cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            scripts/native/finite_camera_rotation_oracle.c -o "$RUNNER_TEMP/finite-camera-rotation-oracle" \
            -lEGL -lGLESv2 -lm
          timeout --signal=TERM --kill-after=5s 120s python3 scripts/run_finite_camera_rotation_oracle.py \
            --hosted-software-only --classes "$RUNNER_TEMP/android-contract-classes" \
            --oracle "$RUNNER_TEMP/finite-camera-rotation-oracle" --artifacts "$RUNNER_TEMP/finite-camera-rotation" \
            | tee "$RUNNER_TEMP/finite-camera-rotation-results.txt"
          grep -Fx 'CAPYIO_FINITE_CAMERA_ROTATION_PIXELS_PASS cases=24 negative_controls=5 pixels=22118400 software=llvmpipe external_oes=true owned_cleanup=true' "$RUNNER_TEMP/finite-camera-rotation-results.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-finite-camera-rotation-evidence
          path: |
            ${{ runner.temp }}/finite-camera-rotation/**
            ${{ runner.temp }}/finite-camera-rotation-results.txt
          if-no-files-found: ignore

  pipewire-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install only official distro PipeWire tools in disposable runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pipewire-bin dbus-daemon
          dpkg-query -W pipewire-bin libpipewire-0.3-modules libspa-0.2-modules
      - name: Validate pure signal oracle and fixture
        run: |
          python3 -m unittest discover -s scripts -p test_pipewire_loopback.py -v
          cargo test --locked -p capyio-linux-audio --example pipewire-pcm-fixture
      - name: Build production adapter fixture
        run: cargo build --locked -p capyio-linux-audio --example pipewire-pcm-fixture
      - name: Require actual isolated PipeWire PCM readback and cleanup
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 60s python3 scripts/run_pipewire_loopback.py \
            --hosted-pipewire-loopback --fixture target/debug/examples/pipewire-pcm-fixture \
            | tee "$RUNNER_TEMP/pipewire-loopback-result.txt"
          grep -Fx 'capyio_pipewire_loopback=passed real_graph=true ordered_pcm=true cleanup=true' \
            "$RUNNER_TEMP/pipewire-loopback-result.txt"
      - name: Build integrated Android-policy command fixture without executing IPC
        run: |
          set -euo pipefail
          cargo build --locked -p capyio-node -p capyio-linux-console --features capyio-node/paired-store,capyio-linux-console/paired-store
          cargo test --locked -p capyio-node --features paired-store --test linux_playback --no-run \
            --message-format=json > "$RUNNER_TEMP/pipewire-e2e-build.jsonl"
      - name: Require one integrated pinned-control UDP PipeWire and Stop run
        run: |
          set -euo pipefail
          fixture="$(python3 - "$RUNNER_TEMP/pipewire-e2e-build.jsonl" <<'PY'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items
                     if item.get('reason') == 'compiler-artifact'
                     and item.get('target', {}).get('name') == 'linux_playback'
                     and item.get('executable')]
          assert len(matches) == 1, 'exact integration executable required'
          print(matches[0])
          PY
          )"
          timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_loopback.py \
            --hosted-pipewire-loopback --e2e-fixture "$fixture" \
            | tee "$RUNNER_TEMP/pipewire-e2e-result.txt"
          grep -Fx 'capyio_pipewire_e2e=passed pinned_tls=true consent=true dynamic_udp=true real_graph=true stop=true cleanup=true' \
            "$RUNNER_TEMP/pipewire-e2e-result.txt"
      - name: Require direct virtual microphone waveform and bounded failure cleanup
        run: |
          set -euo pipefail
          fixture="$(python3 - "$RUNNER_TEMP/pipewire-e2e-build.jsonl" <<'PY'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
          matches = [item['executable'] for item in items
                     if item.get('reason') == 'compiler-artifact'
                     and item.get('target', {}).get('name') == 'linux_playback'
                     and item.get('executable')]
          assert len(matches) == 1, 'exact integration executable required'
          print(matches[0])
          PY
          )"
          for scenario in waveform no_consumer child_exit server_disconnect; do
            timeout --signal=TERM --kill-after=15s 75s python3 scripts/run_pipewire_loopback.py \
              --hosted-pipewire-loopback --virtual-microphone-fixture "$fixture" \
              --virtual-microphone-scenario "$scenario" \
              | tee "$RUNNER_TEMP/pipewire-virtual-microphone-$scenario-result.txt"
            grep -Fx "capyio_pipewire_virtual_microphone=passed scenario=$scenario pinned_tls=true consent=true dynamic_udp=true real_source=true stop=true cleanup=true" \
              "$RUNNER_TEMP/pipewire-virtual-microphone-$scenario-result.txt"
          done
      - name: Validate pure stereo capture signal and graph isolation oracle
        run: python3 -m unittest discover -s scripts -p test_pipewire_capture.py -v
      - name: Build Linux-to-Android stereo capture command fixture without executing IPC
        run: |
          set -euo pipefail
          cargo test --locked -p capyio-node --features paired-store --test linux_capture --no-run \
            --message-format=json > "$RUNNER_TEMP/pipewire-capture-build.jsonl"
      - name: Require isolated stereo capture waveform and lifecycle failure cleanup
        run: |
          set -euo pipefail
          fixture="$(python3 - "$RUNNER_TEMP/pipewire-capture-build.jsonl" <<'PYFIXTURE'
          import json, sys
          items = [json.loads(line) for line in open(sys.argv[1])]
