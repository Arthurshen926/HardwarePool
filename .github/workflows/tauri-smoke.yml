name: Tauri desktop smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/gui/**"
      - "crates/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "pnpm-lock.yaml"
      - ".github/workflows/tauri-smoke.yml"

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: cargo check -p hardwarepool-gui
      - run: pnpm --filter @hardwarepool/gui build
