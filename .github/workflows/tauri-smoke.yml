name: Tauri desktop smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  windows-check:
    name: Windows Tauri check/build (non-Windows explicitly skipped by policy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: pnpm/setup@v1
        with:
          version: 11.5.3
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @capyio/desktop typecheck
      - run: pnpm --filter @capyio/desktop build
      - run: cargo check -p capyio-desktop
      - run: cargo build -p capyio-desktop
