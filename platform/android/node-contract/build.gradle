plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    // Main sources are also compiled into the dependency-free contract runner
    // and Android app. Full compilation avoids overlapping-consumer cache gaps.
    options.incremental = false
}

sourceSets {
    main.java.srcDir '../native-lan-contract/src/main/java'
}

def contractTestOutput = layout.buildDirectory.dir('classes/java/contractTest')

tasks.register('compileContractTest', JavaCompile) {
    group = 'verification'
    source = sourceSets.main.allJava.plus(fileTree('src/contractTest/java'))
    classpath = files()
    destinationDirectory = contractTestOutput
    options.release = 17
    outputs.upToDateWhen { false }
}

tasks.register('contractTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free Android audio node lifecycle contract tests.'
    dependsOn tasks.named('compileContractTest')
    classpath = files(contractTestOutput)
    mainClass = 'dev.capyio.android.contract.AudioNodeContractTest'
    enableAssertions = true
}

tasks.register('nativeLanContractTest', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free CapyIO native LAN wire and UDP loopback tests.'
    dependsOn tasks.named('compileContractTest')
    classpath = files(contractTestOutput)
    mainClass = 'dev.capyio.android.lan.NativeLanContractTest'
    enableAssertions = true
    systemProperty 'capyio.nativeLanFixture',
            rootProject.file('../../fixtures/audio/native_lan_v1_opus_single.hex').absolutePath
}

tasks.register('capabilityCatalogContractTest', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free Android Capability module catalog contract tests.'
    dependsOn tasks.named('compileContractTest')
    classpath = files(contractTestOutput)
    mainClass = 'dev.capyio.android.contract.CapabilityCatalogContractTest'
    enableAssertions = true
}

tasks.register('capabilityLifecycleContractTest', JavaExec) {
    group = 'verification'
    description = 'Runs generation-bound non-audio Android Adapter lifecycle tests.'
    dependsOn tasks.named('compileContractTest')
    classpath = files(contractTestOutput)
    mainClass = 'dev.capyio.android.contract.CapabilityLifecycleContractTest'
    enableAssertions = true
}

tasks.named('check') {
    dependsOn tasks.named('contractTest'), tasks.named('nativeLanContractTest'),
            tasks.named('capabilityCatalogContractTest'),
            tasks.named('capabilityLifecycleContractTest')
}
