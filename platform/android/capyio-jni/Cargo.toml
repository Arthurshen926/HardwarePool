[package]
name = "capyio-android-jni"
description = "Narrow JNI bridge from Android MotionEvent DTOs to private CapyIO touchpad packets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Reuse the existing portable mono packet contract; no codec, platform or crypto dependency.
capyio-audio = { path = "../../../crates/capyio-audio" }
capyio-native-audio-lan = { path = "../../../adapters/native-audio-lan" }
# Reuse the reviewed, transport-free bounded CAVC parser; no new third-party dependency.
capyio-vcamdroid-adapter = { path = "../../../adapters/vcamdroid" }
capyio-protocol = { path = "../../../crates/capyio-protocol" }
capyio-android-host = { path = "../capyio-host" }
capyio-core = { path = "../../../crates/capyio-core" }
capyio-control-credentials = { path = "../../../crates/capyio-control-credentials" }
capyio-control-link = { path = "../../../crates/capyio-control-link" }
capyio-control-tls = { path = "../../../crates/capyio-control-tls" }
capyio-discovery = { path = "../../../crates/capyio-discovery" }
capyio-discovery-udp = { path = "../../../crates/capyio-discovery-udp" }
capyio-input = { path = "../../../crates/capyio-input" }
capyio-pairing = { path = "../../../crates/capyio-pairing" }
capyio-enrollment = { path = "../../../crates/capyio-enrollment" }
capyio-runtime = { path = "../../../crates/capyio-runtime" }
capyio-remote-touchpad-adapter = { path = "../../../adapters/remote-touchpad" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

[dev-dependencies]
capyio-testkit = { path = "../../../crates/capyio-testkit" }
capyio-protocol = { path = "../../../crates/capyio-protocol" }
rcgen = { version = "=0.14.5", default-features = false, features = ["ring"] }
