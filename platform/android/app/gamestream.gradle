// Optional locally built GPL display receiver. Never accepts an opaque arbitrary .so.
def stageOption = providers.gradleProperty('capyioGameStreamStageRoot').orNull
if (stageOption == null) {
    tasks.matching { it.name == 'prePairingLabBuild' }.configureEach {
        doFirst { throw new GradleException('Pairing lab uses the integrated UI; pass -PcapyioGameStreamStageRoot=target/android-moonlight-unified to include its display runtime') }
    }
}
if (stageOption != null) {
    def repository = rootProject.file('../..').canonicalFile
    def stage = new File(repository, stageOption).canonicalFile
    def allowed = new File(repository, 'target').canonicalPath + File.separator
    if (!stage.path.startsWith(allowed)) {
        throw new GradleException('GameStream stage must remain under repository target/')
    }
    def manifest = new File(stage, 'build-manifest.json')
    def library = new File(stage, 'jniLibs/arm64-v8a/libcapyio-gamestream-client.so')
    def hash = { File file ->
        if (!file.isFile()) throw new GradleException("Missing GameStream build input: ${file.name}")
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        file.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
        }
        digest.digest().encodeHex().toString()
    }
    def verify = tasks.register('verifyGameStreamStage') {
        group = 'verification'
        doLast {
            if (!manifest.isFile() || manifest.length() > 1048576) throw new GradleException('Missing or excessive GameStream build manifest')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            if (data.schemaVersion != 1 || data.distribution != 'local-debug-only'
                    || data.ndkVersion != '29.0.14206865'
                    || data.patchSha256 != '07badc78a5e6e0ec58627271b1fe4b55ef6dac7de1f41c39642e7a6e48191ff2') {
                throw new GradleException('GameStream build provenance is incompatible')
            }
            def artifact = data.artifacts.find { it.abi == 'arm64-v8a' }
            if (artifact == null || artifact.sha256 != hash(library)) throw new GradleException('GameStream library hash mismatch')
            byte[] header = new byte[20]
            library.withInputStream { input -> if (input.read(header) != 20) throw new GradleException('Truncated ELF') }
            if (header[0] != 0x7f || header[1] != 69 || header[2] != 76 || header[3] != 70
                    || header[4] != 2 || header[5] != 1 || (header[18] & 255) != 183 || header[19] != 0) {
                throw new GradleException('GameStream library is not little-endian ARM64 ELF')
            }
            def commands = new File(stage, 'native-build/arm64-v8a/compile_commands.json')
            if (hash(commands) != artifact.compileCommandsSha256) throw new GradleException('GameStream compile record changed')
            def compilation = commands.getText('UTF-8')
            ['AudioStream.c', 'RtpAudioQueue.c', 'InputStream.c'].each { forbidden ->
                if (compilation.contains(forbidden)) throw new GradleException("Forbidden display source: $forbidden")
            }
            def checkFiles = { File base, entries ->
                if (!(entries instanceof List) || entries.isEmpty() || entries.size() > 4096) throw new GradleException('Invalid source manifest')
                entries.each { entry ->
                    def input = new File(base, entry.path as String).canonicalFile
                    if (!input.path.startsWith(base.canonicalPath + File.separator) || hash(input) != entry.sha256) {
                        throw new GradleException('GameStream source changed; rebuild the native library')
                    }
                }
            }
            checkFiles(new File(stage, 'source'), data.sourceFiles)
            checkFiles(new File(repository, 'platform/android/capyio-display-android/display-app/src/main/jni'), data.integrationFiles)
        }
    }
    def notices = tasks.register('stageGameStreamNotices', Sync) {
        dependsOn verify
        into layout.buildDirectory.dir('generated/gamestream-assets/capyio-licenses')
        from(new File(stage, 'source/moonlight-common-c/LICENSE.txt')) { rename { 'Moonlight-GPL-3.0.txt' } }
        from(new File(stage, 'source/moonlight-common-c/enet/LICENSE')) { rename { 'ENet-MIT.txt' } }
        from(new File(stage, 'source/moonlight-common-c/nanors/LICENSE')) { rename { 'nanors-MIT.txt' } }
        from(new File(repository, 'docs/MOONLIGHT_ANDROID_DISTRIBUTION_PLAN.md'))
    }
    android.sourceSets.matching { it.name in ['debug', 'pairingLab'] }.configureEach {
        jniLibs.srcDir new File(stage, 'jniLibs')
        assets.srcDir layout.buildDirectory.dir('generated/gamestream-assets').get().asFile
    }
    android.packaging.jniLibs.keepDebugSymbols += ['**/libcapyio-gamestream-client.so']
    def verifyApk = tasks.register('verifyGameStreamDebugApk') {
        group = 'verification'
        dependsOn 'assembleDebug', verify
        doLast {
            def apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
            def zip = new java.util.zip.ZipFile(apk)
            try {
                def entry = zip.getEntry('lib/arm64-v8a/libcapyio-gamestream-client.so')
                if (entry == null) throw new GradleException('Display native library is absent from APK')
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                zip.getInputStream(entry).withCloseable { input ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
                }
                if (digest.digest().encodeHex().toString() != hash(library)) throw new GradleException('Packaged display library differs from verified build')
                ['Moonlight-GPL-3.0.txt', 'ENet-MIT.txt', 'nanors-MIT.txt', 'MOONLIGHT_ANDROID_DISTRIBUTION_PLAN.md'].each { name ->
                    if (zip.getEntry('assets/capyio-licenses/' + name) == null) throw new GradleException("Missing display notice: $name")
                }
            } finally { zip.close() }
        }
    }
    rootProject.tasks.named('capyioCheck') { dependsOn verifyApk }
    tasks.matching { it.name in ['preDebugBuild', 'prePairingLabBuild'] }.configureEach { dependsOn notices }
    tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
        doFirst { throw new GradleException('GameStream source distribution gate is not closed; debug-only integration') }
    }
}
