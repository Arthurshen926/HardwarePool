plugins {
    id 'com.android.application'
}

android {
    namespace = 'dev.capyio.android'
    compileSdk = 36

    defaultConfig {
        applicationId = 'dev.capyio.android'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0-dev'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDir '../node-contract/src/main/java'
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        checkReleaseBuilds = true
        // API 36, AGP 9.3.1 and checksum-pinned Gradle 9.5.0 are deliberate.
        disable += ['GradleDependency', 'OldTargetApi', 'AndroidGradlePluginVersion']
    }
}
