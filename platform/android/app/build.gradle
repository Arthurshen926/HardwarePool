plugins {
    id 'com.android.application'
}

apply from: 'gamestream.gradle'

def repositoryRoot = rootProject.file('../..')
def sharedUiProject = new File(repositoryRoot, 'apps/desktop')
def sharedUiOutput = new File(sharedUiProject, 'dist')
def packagedSharedUiRoot = layout.buildDirectory.dir('generated/capyio-shared-ui').get().asFile
def packagedRustJniRoot = new File(repositoryRoot, 'target/android-jni')
def packagedRustJniLibrary = new File(
        packagedRustJniRoot, 'arm64-v8a/libcapyio_android_jni.so')

tasks.register('buildRustJni', Exec) {
    group = 'build'
    description = 'Builds the ARM64 Rust JNI library packaged by the unified Android app.'
    workingDir repositoryRoot
    def cargoExecutable = System.getProperty('os.name').toLowerCase().contains('windows')
            ? 'cargo.exe' : 'cargo'
    commandLine cargoExecutable, 'ndk', '-t', 'arm64-v8a', '-o',
            packagedRustJniRoot.absolutePath, 'build', '-p', 'capyio-android-jni',
            '--release', '--offline'
    inputs.files(fileTree(repositoryRoot) {
        include 'Cargo.toml', 'Cargo.lock'
        include 'crates/**/Cargo.toml', 'crates/**/src/**'
        include 'adapters/remote-touchpad/Cargo.toml', 'adapters/remote-touchpad/src/**'
        include 'platform/android/capyio-host/Cargo.toml'
        include 'platform/android/capyio-host/src/**'
        include 'platform/android/capyio-jni/Cargo.toml'
        include 'platform/android/capyio-jni/src/**'
    })
    outputs.file packagedRustJniLibrary
}

tasks.register('buildSharedUi', Exec) {
    group = 'build'
    description = 'Builds the shared Vue presentation used by Windows and Android.'
    workingDir repositoryRoot
    def pnpmExecutable = System.getProperty('os.name').toLowerCase().contains('windows')
            ? 'pnpm.cmd' : 'pnpm'
    commandLine pnpmExecutable, '--filter', '@capyio/desktop', 'build'
    inputs.files(fileTree(sharedUiProject) {
        include 'index.html', 'package.json', 'tsconfig.json', 'vite.config.ts'
        include 'src/**'
    })
    inputs.files(new File(repositoryRoot, 'package.json'),
            new File(repositoryRoot, 'pnpm-lock.yaml'),
            new File(repositoryRoot, 'pnpm-workspace.yaml'))
    outputs.dir sharedUiOutput
}

tasks.register('syncSharedUi', Sync) {
    group = 'build'
    description = 'Stages the shared Vue build as Android packaged assets.'
    dependsOn tasks.named('buildSharedUi')
    from sharedUiOutput
    into new File(packagedSharedUiRoot, 'capyio-ui')
}

tasks.register('verifySharedUiAssets') {
    group = 'verification'
    description = 'Verifies the Android package contains a relative-path shared UI entrypoint.'
    dependsOn tasks.named('syncSharedUi')
    doLast {
        def entrypoint = new File(packagedSharedUiRoot, 'capyio-ui/index.html')
        if (!entrypoint.isFile()) {
            throw new GradleException('Shared UI entrypoint is missing from Android assets')
        }
        def html = entrypoint.getText('UTF-8')
        if (html.contains('src="/assets/') || html.contains('href="/assets/')) {
            throw new GradleException('Shared UI assets must use relative paths on Android')
        }
        def assets = new File(packagedSharedUiRoot, 'capyio-ui/assets')
        def assetFiles = assets.isDirectory() ? assets.listFiles() : null
        if (assetFiles == null
                || !assetFiles.any { file -> file.isFile() && file.name.endsWith('.js') }
                || !assetFiles.any { file -> file.isFile() && file.name.endsWith('.css') }) {
            throw new GradleException('Shared UI JavaScript or CSS asset is missing')
        }
    }
}

android {
    namespace = 'dev.capyio.android'
    compileSdk = 36

    defaultConfig {
        applicationId = 'dev.capyio.android'
        minSdk = 29
        targetSdk = 36
        versionCode = 36
        versionName = '0.5.24-alpha.1'
        testInstrumentationRunner 'dev.capyio.android.AndroidCredentialStoreInstrumentation'
        buildConfigField 'String', 'SOURCE_REVISION', groovy.json.JsonOutput.toJson(
                System.getenv('CAPYIO_BUILD_REVISION') ?: 'unrecorded')
        buildConfigField 'String', 'BUILT_AT', groovy.json.JsonOutput.toJson(
                System.getenv('CAPYIO_BUILD_TIME') ?: 'unrecorded')
        ndk {
            abiFilters 'arm64-v8a'
        }
        manifestPlaceholders = [
            capyioSpeakerLabEnabled: System.getenv('CAPYIO_ANDROID_SPEAKER_PEER_IPV4') == null
                    ? 'false' : 'true',
            capyioSpeakerPeerIpv4: System.getenv('CAPYIO_ANDROID_SPEAKER_PEER_IPV4') ?: '127.0.0.1',
            capyioSpeakerLocalPort: System.getenv('CAPYIO_ANDROID_SPEAKER_LOCAL_PORT') ?: '40000',
            capyioSpeakerPeerPort: System.getenv('CAPYIO_ANDROID_SPEAKER_PEER_PORT') ?: '40001',
            capyioSpeakerSessionId: 'a1000000-0000-4000-8000-000000000001',
            capyioSpeakerRouteId: 'a1000000-0000-4000-8000-000000000002',
            capyioSpeakerStreamId: 'a1000000-0000-4000-8000-000000000003',
            capyioSpeakerStreamEpoch: '1',
            capyioMicrophoneLabEnabled: System.getenv('CAPYIO_ANDROID_MICROPHONE_PEER_IPV4') == null
                    ? 'false' : 'true',
            capyioMicrophonePeerIpv4: System.getenv('CAPYIO_ANDROID_MICROPHONE_PEER_IPV4') ?: '127.0.0.1',
            capyioMicrophoneLocalPort: System.getenv('CAPYIO_ANDROID_MICROPHONE_LOCAL_PORT') ?: '40010',
            capyioMicrophonePeerPort: System.getenv('CAPYIO_ANDROID_MICROPHONE_PEER_PORT') ?: '40011',
            capyioMicrophoneSessionId: 'a2000000-0000-4000-8000-000000000001',
            capyioMicrophoneRouteId: 'a2000000-0000-4000-8000-000000000002',
            capyioMicrophoneStreamId: 'a2000000-0000-4000-8000-000000000003',
            capyioMicrophoneStreamEpoch: '1',
        ]
    }

    buildTypes {
        pairingLab {
            initWith debug
            applicationIdSuffix = '.pairinglab'
            versionNameSuffix = '-pairing-lab'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main.java.srcDir 'src/main/java'
        main.java.srcDir '../node-contract/src/main/java'
        main.java.srcDir '../native-lan-contract/src/main/java'
        main.java.srcDir '../capyio-camera-app/camera-contract/src/main/java'
        main.java.srcDir '../capyio-camera-app/app/src/main/java'
        main.java.srcDir '../capyio-display-android/display-sink/src/main/java'
        main.java.srcDir '../capyio-display-android/display-app/src/main/java'
        main.assets.srcDir packagedSharedUiRoot
        main.jniLibs.srcDir packagedRustJniRoot
    }

    lint {
        abortOnError = true
        warningsAsErrors = true
        checkReleaseBuilds = true
        // API 36, AGP 9.3.1 and checksum-pinned Gradle 9.5.0 are deliberate.
        disable += ['GradleDependency', 'OldTargetApi', 'AndroidGradlePluginVersion']
    }
}

tasks.named('preBuild') {
    dependsOn tasks.named('syncSharedUi')
    dependsOn tasks.named('buildRustJni')
}

tasks.register('verifyDebugEntrypoints') {
    group = 'verification'
    description = 'Fails when Android manifest entrypoint classes are absent from the debug build.'
    dependsOn 'compileDebugJavaWithJavac'

    doLast {
        def classesDirectory = tasks.named('compileDebugJavaWithJavac').get()
                .destinationDirectory.get().asFile
        [
            'dev/capyio/android/MainActivity.class',
            'dev/capyio/android/AudioNodeService.class',
            'dev/capyio/android/AndroidCapabilityCommand.class',
            'dev/capyio/android/AndroidAudioCommand.class',
            'dev/capyio/android/AndroidCameraCommand.class',
            'dev/capyio/android/AndroidHapticsCommand.class',
            'dev/capyio/android/AndroidHapticsSinkAdapter.class',
            'dev/capyio/android/AndroidForegroundOwnership.class',
            'dev/capyio/android/AndroidAssetWebViewClient.class',
            'dev/capyio/android/AndroidSharingSelection.class',
            'dev/capyio/android/AndroidGamepadUiCommand.class',
            'dev/capyio/android/AndroidTouchpadUiFrame.class',
            'dev/capyio/android/AndroidUiSnapshotJson.class',
            'dev/capyio/android/AndroidCoreCatalogJson.class',
            'dev/capyio/android/AndroidNativeCatalogRuntime.class',
            'dev/capyio/android/AndroidNativeControlCredential.class',
            'dev/capyio/android/AndroidNativeControlListener.class',
            'dev/capyio/android/AndroidNativePairingDirectory.class',
            'dev/capyio/android/AndroidPairingDirectoryStore.class',
            'dev/capyio/android/AndroidCredentialStore.class',
            'dev/capyio/android/TouchpadRouteAdapter.class',
            'dev/capyio/android/ControllerRouteAdapter.class',
            'dev/capyio/touchpad/NativeTouchpadRecordBridge.class',
            'io/capyio/camera/lab/CameraCaptureService.class',
            'io/capyio/camera/lab/UnifiedCameraNodeFacade.class',
            'dev/capyio/display/app/DisplayActivity.class',
            'dev/capyio/display/MediaCodecSurfaceDecoder.class',
        ].each { relativePath ->
            if (!new File(classesDirectory, relativePath).isFile()) {
                throw new GradleException("Android entrypoint class is missing: ${relativePath}")
            }
        }
    }
}

tasks.register('verifyIntegratedDebugApk') {
    group = 'verification'
    description = 'Verifies the unified debug APK packages the shared UI and ARM64 Rust Runtime.'
    dependsOn 'assembleDebug'
    doLast {
        def apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
        if (!apk.isFile()) {
            throw new GradleException('Unified debug APK is missing')
        }
        def archive = new java.util.zip.ZipFile(apk)
        try {
            [
                'AndroidManifest.xml',
                'classes.dex',
                'assets/capyio-ui/index.html',
                'lib/arm64-v8a/libcapyio_android_jni.so',
            ].each { entry ->
                if (archive.getEntry(entry) == null) {
                    throw new GradleException("Unified debug APK entry is missing: ${entry}")
                }
            }
        } finally {
            archive.close()
        }
    }
}

