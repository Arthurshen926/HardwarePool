plugins {
    id "com.android.application"
}

def capyioGameStreamJniDir = providers.gradleProperty("capyioGameStreamJniDir").orNull

android {
    namespace "dev.capyio.display.app"
    compileSdk 36

    defaultConfig {
        applicationId "dev.capyio.display.app"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "0.1.0-prealpha"

    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (capyioGameStreamJniDir != null) {
        def nativeRoot = file(capyioGameStreamJniDir)
        sourceSets {
            main {
                jniLibs.srcDirs(nativeRoot)
            }
        }
    }
}

tasks.register("verifyGameStreamJni") {
    doLast {
        if (capyioGameStreamJniDir == null) {
            throw new GradleException("capyioGameStreamJniDir is required for a GameStream-capable APK")
        }
        def libraries = fileTree(capyioGameStreamJniDir) {
            include "*/libcapyio-gamestream-client.so"
        }.files
        if (libraries.isEmpty()) {
            throw new GradleException("no ABI contains libcapyio-gamestream-client.so under ${capyioGameStreamJniDir}")
        }
    }
}

dependencies {
    implementation project(":display-sink")
}

def aspectRatioHarnessClasses = layout.buildDirectory.dir("aspect-ratio-harness/classes")

tasks.register("compileAspectRatioFitHarness", JavaCompile) {
    source(
        "src/main/java/dev/capyio/display/app/AspectRatioFit.java",
        "src/testHarness/java/dev/capyio/display/app/AspectRatioFitHarness.java"
    )
    classpath = files()
    destinationDirectory = aspectRatioHarnessClasses
    options.release = 17
    options.encoding = "UTF-8"
}

tasks.register("aspectRatioFitHarness", JavaExec) {
    dependsOn("compileAspectRatioFitHarness")
    classpath = files(aspectRatioHarnessClasses)
    mainClass = "dev.capyio.display.app.AspectRatioFitHarness"
}

