[package]
name = "capyio-linux-host"
description = "Bounded local control loop for the headless Linux Node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
paired-store = ["dep:capyio-linux-pairing-store", "dep:capyio-enrollment"]
native-touchpad = ["capyio-linux-touchpad/native-uinput"]
touchpad-test-fixture = ["capyio-linux-touchpad/test-fixture"]
native-camera = ["capyio-linux-avc/native-pipewire"]

[dependencies]
capyio-mock-source = { path = "../../../adapters/mock-source" }
capyio-core = { path = "../../../crates/capyio-core" }
capyio-runtime = { path = "../../../crates/capyio-runtime" }
serde.workspace = true
serde_json.workspace = true
capyio-adapter-host = { path = "../../../crates/capyio-adapter-host" }
capyio-adapter-sdk = { path = "../../../crates/capyio-adapter-sdk" }

[dev-dependencies]
capyio-control-host = { path = "../../../crates/capyio-control-host" }
rcgen = { version = "=0.14.5", default-features = false, features = ["ring"] }
capyio-testkit = { path = "../../../crates/capyio-testkit" }

[target.'cfg(target_os = "linux")'.dependencies]
capyio-enrollment = { path = "../../../crates/capyio-enrollment", optional = true }
capyio-linux-audio = { path = "../capyio-audio" }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }

capyio-control-link = { path = "../../../crates/capyio-control-link" }
capyio-control-tls = { path = "../../../crates/capyio-control-tls" }
capyio-protocol = { path = "../../../crates/capyio-protocol" }
capyio-control-credentials = { path = "../../../crates/capyio-control-credentials" }
capyio-pairing = { path = "../../../crates/capyio-pairing" }

capyio-linux-avc = { path = "../capyio-avc" }

capyio-linux-touchpad = { path = "../capyio-touchpad" }

[target.'cfg(target_os = "linux")'.dependencies.capyio-linux-pairing-store]
path = "../capyio-pairing-store"
optional = true
features = ["native-secret-service"]
