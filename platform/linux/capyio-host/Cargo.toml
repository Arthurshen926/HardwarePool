[package]
name = "capyio-linux-host"
description = "Bounded local control loop for the headless Linux Node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
capyio-mock-source = { path = "../../../adapters/mock-source" }
capyio-core = { path = "../../../crates/capyio-core" }
capyio-runtime = { path = "../../../crates/capyio-runtime" }
serde.workspace = true
serde_json.workspace = true
capyio-adapter-host = { path = "../../../crates/capyio-adapter-host" }
capyio-adapter-sdk = { path = "../../../crates/capyio-adapter-sdk" }

[dev-dependencies]
capyio-control-link = { path = "../../../crates/capyio-control-link" }
capyio-control-tls = { path = "../../../crates/capyio-control-tls" }
capyio-protocol = { path = "../../../crates/capyio-protocol" }
rcgen = { version = "=0.14.5", default-features = false, features = ["ring"] }
capyio-testkit = { path = "../../../crates/capyio-testkit" }

[target.'cfg(target_os = "linux")'.dependencies]
capyio-linux-audio = { path = "../capyio-audio" }
