<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CapyIO camera latency clock</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Consolas, "Cascadia Mono", monospace;
      }
      body {
        align-items: center;
        background: #050505;
        color: #f7f7f7;
        display: flex;
        flex-direction: column;
        height: 100vh;
        justify-content: center;
        margin: 0;
        overflow: hidden;
      }
      body.light {
        background: #f7f7f7;
        color: #050505;
      }
      #clock {
        font-size: min(12vw, 22vh);
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        letter-spacing: -0.06em;
        line-height: 1;
      }
      #epoch,
      #phase {
        font-size: min(3vw, 6vh);
        font-variant-numeric: tabular-nums;
        margin-top: 4vh;
      }
    </style>
  </head>
  <body>
    <div id="clock">00:00:00.000</div>
    <div id="epoch">epoch_ms=0</div>
    <div id="phase">phase=0</div>
    <script>
      const clock = document.querySelector("#clock");
      const epoch = document.querySelector("#epoch");
      const phase = document.querySelector("#phase");

      function render() {
        const now = new Date();
        const value = now.getTime();
        const currentPhase = Math.floor(value / 250);
        clock.textContent = now.toISOString().slice(11, 23);
        epoch.textContent = `epoch_ms=${value}`;
        phase.textContent = `phase=${currentPhase}`;
        document.body.classList.toggle("light", currentPhase % 2 === 0);
        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    </script>
  </body>
</html>
