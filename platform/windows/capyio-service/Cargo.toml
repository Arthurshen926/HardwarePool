[package]
name = "capyio-windows-service"
description = "Headless Windows hosts for CapyIO audio projections."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
capyio-audio-share-adapter = { path = "../../../adapters/audio-share" }
capyio-micyou-adapter = { path = "../../../adapters/micyou" }
capyio-micyou-host-config = { path = "../micyou-host-config" }
capyio-native-audio-lan = { path = "../../../adapters/native-audio-lan" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
capyio-windows-capture-ring = { path = "../capture-ring" }
windows-service.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
