[package]
name = "capyio-windows-service"
description = "Headless Windows broker foundations for CapyIO projections."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
capyio-audio-share-adapter = { path = "../../../adapters/audio-share" }
capyio-micyou-adapter = { path = "../../../adapters/micyou" }
capyio-micyou-host-config = { path = "../micyou-host-config" }
capyio-native-audio-lan = { path = "../../../adapters/native-audio-lan" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
capyio-windows-camera-share = { path = "../capyio-camera-share" }
capyio-audio = { path = "../../../crates/capyio-audio" }
capyio-display-stream-adapter = { path = "../../../adapters/sunshine-moonlight" }
capyio-display-engine-host = { path = "../capyio-display-engine-host" }
capyio-core = { path = "../../../crates/capyio-core" }
capyio-display = { path = "../../../crates/capyio-display" }
capyio-display-tls = { path = "../../../crates/capyio-display-tls" }
capyio-display-transport = { path = "../../../crates/capyio-display-transport" }
capyio-video = { path = "../../../crates/capyio-video" }
capyio-windows-display = { path = "../capyio-display" }
capyio-windows-capture-ring = { path = "../capture-ring" }
windows-service.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Services",
] }
