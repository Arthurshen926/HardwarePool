[package]
name = "capyio-windows-input"
description = "Windows input projection and runtime probes for CapyIO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
capyio-core = { path = "../../../crates/capyio-core" }
capyio-data-plane = { path = "../../../crates/capyio-data-plane" }
capyio-dsu-adapter = { path = "../../../adapters/dsu" }
capyio-input = { path = "../../../crates/capyio-input" }
capyio-runtime = { path = "../../../crates/capyio-runtime" }
capyio-sensor-server-adapter = { path = "../../../adapters/sensor-server" }
capyio-viiper-adapter = { path = "../../../adapters/viiper" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_UI_Controls",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
capyio-core = { path = "../../../crates/capyio-core" }
capyio-testkit = { path = "../../../crates/capyio-testkit" }
tungstenite.workspace = true
