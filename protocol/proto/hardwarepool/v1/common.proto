syntax = "proto3";

package hardwarepool.v1;

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_WINDOWS = 1;
  PLATFORM_ANDROID = 2;
  PLATFORM_LINUX = 3;
  PLATFORM_MACOS = 4;
  PLATFORM_IOS = 5;
  PLATFORM_EMBEDDED = 6;
  PLATFORM_OTHER = 100;
}

enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  NODE_ROLE_PROVIDER = 1;
  NODE_ROLE_CONSUMER = 2;
  NODE_ROLE_DUPLEX = 3;
  NODE_ROLE_LIGHTWEIGHT = 4;
}

enum CapabilityKind {
  CAPABILITY_KIND_UNSPECIFIED = 0;
  CAPABILITY_KIND_AUDIO_CAPTURE = 1;
  CAPABILITY_KIND_AUDIO_RENDER = 2;
  CAPABILITY_KIND_AUDIO_DUPLEX_BUNDLE = 3;
  CAPABILITY_KIND_CUSTOM = 100;
}

enum LocalRole {
  LOCAL_ROLE_UNSPECIFIED = 0;
  LOCAL_ROLE_CAPTURE = 1;
  LOCAL_ROLE_RENDER = 2;
  LOCAL_ROLE_CONTROL = 3;
  LOCAL_ROLE_COMPUTE = 4;
  LOCAL_ROLE_COMPOSITE = 5;
}

enum StreamRole {
  STREAM_ROLE_UNSPECIFIED = 0;
  STREAM_ROLE_PRODUCER = 1;
  STREAM_ROLE_CONSUMER = 2;
  STREAM_ROLE_DUPLEX = 3;
  STREAM_ROLE_NONE = 4;
}

enum ProjectionKind {
  PROJECTION_KIND_UNSPECIFIED = 0;
  PROJECTION_KIND_APPLICATION_STREAM = 1;
  PROJECTION_KIND_SYSTEM_CAPTURE_ENDPOINT = 2;
  PROJECTION_KIND_SYSTEM_RENDER_ENDPOINT = 3;
  PROJECTION_KIND_VIRTUAL_INPUT_DEVICE = 4;
  PROJECTION_KIND_VIRTUAL_DISPLAY = 5;
  PROJECTION_KIND_REMOTE_COMPUTE_SERVICE = 6;
}

enum PermissionRequirement {
  PERMISSION_REQUIREMENT_UNSPECIFIED = 0;
  PERMISSION_REQUIREMENT_NONE = 1;
  PERMISSION_REQUIREMENT_USER_CONFIRMATION = 2;
  PERMISSION_REQUIREMENT_FOREGROUND_SERVICE = 3;
  PERMISSION_REQUIREMENT_PRIVILEGED = 4;
}

enum Availability {
  AVAILABILITY_UNSPECIFIED = 0;
  AVAILABILITY_AVAILABLE = 1;
  AVAILABILITY_BUSY = 2;
  AVAILABILITY_PERMISSION_REQUIRED = 3;
  AVAILABILITY_OFFLINE = 4;
}

message ProfileId {
  string name = 1;
  uint32 major = 2;
}
