syntax = "proto3";

package capyio.v1;

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_WINDOWS = 1;
  PLATFORM_ANDROID = 2;
  PLATFORM_LINUX = 3;
  PLATFORM_MACOS = 4;
  PLATFORM_IOS = 5;
  PLATFORM_EMBEDDED = 6;
  PLATFORM_OTHER = 100;
}

enum OnlineState {
  ONLINE_STATE_UNSPECIFIED = 0;
  ONLINE_STATE_ONLINE = 1;
  ONLINE_STATE_OFFLINE = 2;
}

enum AdapterDeploymentMode {
  ADAPTER_DEPLOYMENT_MODE_UNSPECIFIED = 0;
  ADAPTER_DEPLOYMENT_MODE_IN_PROCESS = 1;
  ADAPTER_DEPLOYMENT_MODE_SIDECAR = 2;
  ADAPTER_DEPLOYMENT_MODE_EXTERNAL_SERVICE = 3;
  ADAPTER_DEPLOYMENT_MODE_DRIVER_BACKED = 4;
}

enum AdapterState {
  ADAPTER_STATE_UNSPECIFIED = 0;
  ADAPTER_STATE_DISCOVERED = 1;
  ADAPTER_STATE_INITIALIZING = 2;
  ADAPTER_STATE_READY = 3;
  ADAPTER_STATE_DEGRADED = 4;
  ADAPTER_STATE_FAILED = 5;
  ADAPTER_STATE_STOPPED = 6;
}

enum AdapterHealth {
  ADAPTER_HEALTH_UNSPECIFIED = 0;
  ADAPTER_HEALTH_UNKNOWN = 1;
  ADAPTER_HEALTH_HEALTHY = 2;
  ADAPTER_HEALTH_DEGRADED = 3;
  ADAPTER_HEALTH_UNHEALTHY = 4;
}

enum CapabilityClass {
  CAPABILITY_CLASS_UNSPECIFIED = 0;
  CAPABILITY_CLASS_MICROPHONE = 1;
  CAPABILITY_CLASS_SPEAKER = 2;
  CAPABILITY_CLASS_CAMERA = 3;
  CAPABILITY_CLASS_DISPLAY = 4;
  CAPABILITY_CLASS_KEYBOARD = 5;
  CAPABILITY_CLASS_POINTER = 6;
  CAPABILITY_CLASS_TOUCHSCREEN = 7;
  CAPABILITY_CLASS_GAMEPAD = 8;
  CAPABILITY_CLASS_IMU = 9;
  CAPABILITY_CLASS_GNSS = 10;
  CAPABILITY_CLASS_SENSOR_SUITE = 11;
  CAPABILITY_CLASS_HAPTICS = 12;
  CAPABILITY_CLASS_RECORDER = 13;
  CAPABILITY_CLASS_PANEL = 14;
  CAPABILITY_CLASS_BRIDGE = 15;
  CAPABILITY_CLASS_CUSTOM = 100;
}

enum PermissionRequirement {
  PERMISSION_REQUIREMENT_UNSPECIFIED = 0;
  PERMISSION_REQUIREMENT_NONE = 1;
  PERMISSION_REQUIREMENT_USER_CONFIRMATION = 2;
  PERMISSION_REQUIREMENT_FOREGROUND_SERVICE = 3;
  PERMISSION_REQUIREMENT_PRIVILEGED = 4;
}

enum Availability {
  AVAILABILITY_UNSPECIFIED = 0;
  AVAILABILITY_AVAILABLE = 1;
  AVAILABILITY_BUSY = 2;
  AVAILABILITY_PERMISSION_REQUIRED = 3;
  AVAILABILITY_OFFLINE = 4;
}

enum PortDirection {
  PORT_DIRECTION_UNSPECIFIED = 0;
  PORT_DIRECTION_SOURCE = 1;
  PORT_DIRECTION_SINK = 2;
  PORT_DIRECTION_CONTROL = 3;
}

enum QosMode {
  QOS_MODE_UNSPECIFIED = 0;
  QOS_MODE_BASIC = 1;
  QOS_MODE_INTERACTIVE = 2;
  QOS_MODE_MEASUREMENT = 3;
  QOS_MODE_CUSTOM = 100;
}

enum InteroperabilityMode {
  INTEROPERABILITY_MODE_UNSPECIFIED = 0;
  INTEROPERABILITY_MODE_STANDARD_PORT = 1;
  INTEROPERABILITY_MODE_ADAPTER_MANAGED = 2;
}

enum RouteBackend {
  ROUTE_BACKEND_UNSPECIFIED = 0;
  ROUTE_BACKEND_CAPY_DATA_PLANE = 1;
  ROUTE_BACKEND_ADAPTER_MANAGED = 2;
  ROUTE_BACKEND_LOCAL_PIPELINE = 3;
  ROUTE_BACKEND_EXTERNAL_PROTOCOL = 4;
}

enum RouteState {
  ROUTE_STATE_UNSPECIFIED = 0;
  ROUTE_STATE_DRAFT = 1;
  ROUTE_STATE_PREPARED = 2;
  ROUTE_STATE_STARTING = 3;
  ROUTE_STATE_ACTIVE = 4;
  ROUTE_STATE_STOPPING = 5;
  ROUTE_STATE_STOPPED = 6;
  ROUTE_STATE_FAILED = 7;
  ROUTE_STATE_OFFLINE = 8;
}

enum AuthorizationState {
  AUTHORIZATION_STATE_UNSPECIFIED = 0;
  AUTHORIZATION_STATE_PENDING = 1;
  AUTHORIZATION_STATE_AUTHORIZED = 2;
  AUTHORIZATION_STATE_DENIED = 3;
  AUTHORIZATION_STATE_REVOKED = 4;
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message ProfileId {
  string name = 1;
  uint32 major = 2;
}

message QosDescriptor {
  QosMode mode = 1;
  string custom_mode = 2;
}
