[package]
name = "hardwarepool-gui"
description = "Tauri host for the shared HardwarePool control surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "hardwarepool_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hardwarepool-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
hardwarepool-core = { path = "../../../crates/hardwarepool-core" }
hardwarepool-runtime = { path = "../../../crates/hardwarepool-runtime" }
hardwarepool-testkit = { path = "../../../crates/hardwarepool-testkit" }
serde.workspace = true
tauri = { version = "2.11.2", features = [] }
