[package]
name = "capyio-node"
description = "Headless CapyIO bootstrap node and deterministic CLI demo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
paired-store = ["capyio-linux-host/paired-store"]
native-touchpad = ["capyio-linux-host/native-touchpad"]
touchpad-test-fixture = ["capyio-linux-host/touchpad-test-fixture"]
native-camera = ["capyio-linux-host/native-camera"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
capyio-core = { path = "../../crates/capyio-core" }
capyio-data-plane = { path = "../../crates/capyio-data-plane" }
capyio-audio = { path = "../../crates/capyio-audio" }
capyio-protocol = { path = "../../crates/capyio-protocol" }
capyio-runtime = { path = "../../crates/capyio-runtime" }
capyio-testkit = { path = "../../crates/capyio-testkit" }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
capyio-linux-host = { path = "../../platform/linux/capyio-host" }

[dev-dependencies]
capyio-android-jni = { path = "../../platform/android/capyio-jni" }
capyio-control-credentials = { path = "../../crates/capyio-control-credentials" }
capyio-control-link = { path = "../../crates/capyio-control-link" }
capyio-control-tls = { path = "../../crates/capyio-control-tls" }
capyio-pairing = { path = "../../crates/capyio-pairing" }
capyio-native-audio-lan = { path = "../../adapters/native-audio-lan" }
rcgen = { version = "=0.14.5", default-features = false, features = ["ring"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "pipe", "std"] }
capyio-vcamdroid-adapter = { path = "../../adapters/vcamdroid" }
capyio-android-host = { path = "../../platform/android/capyio-host" }
capyio-input = { path = "../../crates/capyio-input" }
capyio-linux-touchpad = { path = "../../platform/linux/capyio-touchpad" }
capyio-remote-touchpad-adapter = { path = "../../adapters/remote-touchpad", features = ["tls"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
capyio-linux-pairing-store = { path = "../../platform/linux/capyio-pairing-store" }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
sha2.workspace = true
