        - internal/server/api/handler/device.go
        - internal/server/api/handler/ping.go
        - internal/server/usb/server.go
        - device/xbox360/const.go
        - device/xbox360/inputstate.go
        - device/dualshock4/const.go
        - device/dualshock4/inputstate.go
        - device/dualshock4/device.go
      management_framing: >-
        null-terminated UTF-8 request; JSON success/problem response terminated
        by connection close
      documented_default_api_port: 3242
      device_stream: null-terminated path handshake followed by fixed binary packets
      xbox360_input_bytes: 20
      xbox360_rumble_bytes: 2
      dualshock4_input_bytes: 31
      dualshock4_feedback_bytes: 7
      purpose: >-
        Implement a deterministic CapyIO-owned codec for the documented external
        standalone-server TCP contract without importing an upstream client or source.
    runtime_dependencies:
      - VIIPER standalone server supplied separately by the user
      - platform USB/IP client; usbip-win2 is the documented Windows candidate
    client_dependencies:
      - name: serde
        version: 1.0.229
        license: MIT OR Apache-2.0
        purpose: deserialize fixed deny-unknown-field VIIPER response DTOs
      - name: serde_json
        version: 1.0.151
        license: MIT OR Apache-2.0
        purpose: >-
          parse management JSON only after the TCP response has passed an
          independent total byte limit and connection-close deadline
      - name: thiserror
        version: 2.0.20
        license: MIT OR Apache-2.0
        purpose: expose typed configuration, transport, protocol and compatibility failures
    client_dependency_alternatives_rejected:
      - hand-written JSON parsing
      - importing an upstream generated client or linking libVIIPER
    security_findings:
      - localhost authentication is optional upstream and must be made explicit before a live Adapter slice
      - remote API access requires authentication and encryption but is outside the current local-only plan
      - the client applies explicit response-size and absolute socket-deadline bounds before parsing API JSON
      - localhost device creation may auto-attach USB/IP upstream and is not safe to probe as a read-only operation
      - >-
        fixed v0.7.0 documentation and source disagree on whether a failed
        localhost auto-attach affects the add response; reviewed source can
        return 409 after device creation without rollback
      - >-
        mutating CapyIO calls require a caller assertion that localhost
        auto-attach was independently disabled; the token is not proof of the
        external server configuration
      - older test-signed USB/IP candidates could change trust/boot policy and are prohibited; the selected signed package is recorded separately
      - driver install, attach, removal and certificate-store changes require separate human approval
      - >-
        release v0.7.0 completed USB/IP liveness while Windows kept its exact
        DS4 HID interface disabled; the reviewed Alia5 current revision behaved
        the same. The hbashton v0.1.0 fork enabled the standard HID interface
        and passed the changing-report direct-HID Gate. After correcting the
        native probe's WGI discovery window and 32-byte RID_DEVICE_INFO union
        ABI, both hbashton v0.1.0 and v0.1.2 also passed exact WGI dynamic input
        and RawInput inventory. The controlled Chrome surface exposed neither
        this DS4 nor a ViGEm Xbox control device and is not absence evidence for
        the host browser API
    alternatives_considered:
      - link GPL-licensed libVIIPER directly
      - import an upstream generated client library
      - implement a new device-specific Windows kernel driver
    distribution_note: >-
      CapyIO does not vendor, link, repackage or distribute VIIPER, a generated
      client, libVIIPER, usbip-win2 or any binary in this slice. The reviewed
      experimental source archive, comparison patch, toolchain and executable
      remain ignored local-lab artifacts under `target/`; none are imported or
      distributed. The standalone external-process boundary avoids linking
      libVIIPER but still requires a distribution and legal review before
      product packaging.
