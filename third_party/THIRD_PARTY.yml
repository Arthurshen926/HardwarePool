  - id: microsoft-windows-rs-camera-bindings
    upstream_repository: https://github.com/microsoft/windows-rs
    pinned_release: windows-0.61.3
    license: MIT OR Apache-2.0
    integration_mode: target_specific_optional_api_binding
    source_imported: false
    binary_imported: false
    imported_paths: []
    local_modifications: []
    enabled_features:
      - Win32_Foundation
      - Win32_Media_KernelStreaming
      - Win32_Media_MediaFoundation
      - Win32_System_Com
      - Win32_System_Com_StructuredStorage
      - Win32_System_Variant
    resolved_packages:
      - name: windows
        version: 0.61.3
      - name: windows-core
        version: 0.61.2
      - name: windows-sys
        version: 0.61.2
    camera_shared_mapping_dependency:
      name: windows-sys
      version: 0.61.2
      license: MIT OR Apache-2.0
      upstream_repository: https://github.com/microsoft/windows-rs
      enabled_features:
        - Win32_Foundation
        - Win32_Security
        - Win32_Security_Authorization
        - Win32_System_Memory
        - Win32_System_Threading
      purpose: >-
        Create and open the fixed decoded-camera file mapping, apply its SDDL,
        map read/write or read-only views and identify the single producer
        process without hand-written Win32 FFI. This package/version was already
        resolved by the workspace before the camera slice.
      maintenance_status: >-
        Official Microsoft windows-rs raw bindings; version is locked by
        Cargo.lock and the dependency is Windows-target-specific.
      alternatives_rejected:
        - hand-written CreateFileMapping/OpenFileMapping/security FFI
        - high-bandwidth frame payloads over JSON-RPC or sidecar stdout
        - a new kernel camera transport
    purpose: >-
      Provide typed Windows Media Foundation and COM bindings for the opt-in
      read-only SoftwareCameraSource support probe and the local non-registered
      source/stream projection, COM class factory and closed virtual-camera
      registration backend without hand-written unsafe declarations.
    alternatives_rejected:
      - hand-written Windows FFI and COM declarations
      - importing the Microsoft Windows-Camera C++ sample
      - placing Media Foundation bindings in portable capyio-video or Core
    security_note: >-
      The binding is Windows-only, optional and locked by Cargo.lock. Camera
      creation and registration APIs are not called in CAPY-CAMERA-001B0 or
      CAPY-CAMERA-001B1B; their COM tests construct objects only in-process.
      CAPY-CAMERA-001B1C calls MFCreateVirtualCamera during an opt-in preflight,
      while Start/Stop/Remove and HKLM deployment remain separately authorized
      host-lab operations outside CI.
