    review_findings:
      - enumerates a render speaker and capture microphone endpoint
      - render PCM is discarded by default or sent to a debug kernel file path
      - capture PCM is deterministic silence
      - no supported user-mode PCM IPC or transport boundary was found
    distribution_note: >-
      Neither revision is imported or redistributed. The signed release is not
      a functional CapyIO transport baseline and its missing notices file must
      be resolved before any future redistribution review.
