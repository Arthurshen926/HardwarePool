    private_contract:
      negotiation: TCP
      audio_payload: UDP PCM
      default_port: 65530
      capyio_route_backend: AdapterManaged
    monitor_dependency:
      name: windows-sys
      version: 0.61.2
      license: MIT OR Apache-2.0
      enabled_features:
        - Win32_Foundation
        - Win32_NetworkManagement_IpHelper
        - Win32_Networking_WinSock
        - Win32_Security
        - Win32_Security_Authorization
        - Win32_System_Memory
      purpose: >-
        Query process-owned established TCP rows and own the bounded cross-session
        render-ring mapping without parsing human logs or hand-written FFI.
      alternatives_rejected:
        - localized PowerShell or netstat output
        - hand-written Windows FFI
        - upstream log parsing
    private_transport_dependency:
      name: prost
      version: 0.14.4
      license: MIT OR Apache-2.0
      upstream_repository: https://github.com/tokio-rs/prost
      purpose: encode the bounded pinned AudioFormat message without importing generated upstream code
      alternatives_rejected:
        - hand-written Protobuf varint encoding
        - importing upstream generated C++ or Kotlin sources
    service_host_dependency:
      name: windows-service
      version: 0.8.1
      license: MIT OR Apache-2.0
      upstream_repository: https://github.com/mullvad/windows-service-rs
      purpose: >-
        Register the headless CapyIOBroker process with Windows Service Control
        Manager and handle bounded status and stop transitions without
        hand-written unsafe SCM FFI.
      alternatives_rejected:
        - hand-written Windows Service Control Manager FFI
        - scheduled-task lifecycle ownership
        - retaining the elevated Tauri host as production lifecycle owner
    distribution_note: >-
      CapyIO does not vendor, link, repackage or distribute Audio Share in this
      slice. Tests use a user-supplied, hash-verified unmodified release. The
      unsigned Windows executable and Android lifecycle behavior require
      further review before any public packaging.
  - id: microsoft-sysvad
    upstream_repository: https://github.com/microsoft/Windows-driver-samples
    pinned_revision: 717778a20ba4dd2440fe609f69153a1f8a64f597
    upstream_path: audio/sysvad
    license: MS-PL
    license_source: https://github.com/microsoft/Windows-driver-samples/blob/717778a20ba4dd2440fe609f69153a1f8a64f597/LICENSE
    integration_mode: driver_derivative
    source_imported: true
    binary_imported: false
    imported_paths:
      - drivers/windows-audio/sysvad/sysvad.sln
      - drivers/windows-audio/sysvad/root-driver-sources
      - drivers/windows-audio/sysvad/EndpointsCommon
      - drivers/windows-audio/sysvad/TabletAudioSample
      - drivers/windows-audio/sysvad/APO/Inc
      - drivers/windows-audio/sysvad/APO/SwapAPO
      - drivers/windows-audio/sysvad/Package
    local_modifications:
      - retain only the speaker render endpoint in the runtime endpoint arrays
      - remove keyword detector, capture, HDMI, SPDIF, headphone, delay, KWS and AEC package dependencies
      - rename the device, service, binary and APO for CapyIO ownership
      - replace sample hardware identifiers and APO identifiers with CapyIO-owned values
      - add a bounded non-blocking render-APO staging bridge
    build_only_submodules:
      - id: microsoft-wil
        upstream_repository: https://github.com/microsoft/wil
        pinned_revision: 3c00e7f1d8cf9930bbb8e5be3ef0df65c84e8928
        archive_sha256: 0e4974ff5f74b2afbe95e8f85ddc6b7329adf5718a228d54e4b21da132a1a13e
        license: MIT
        source_imported: false
        binary_imported: false
        purpose: restore the upstream SysVAD Git submodule in ignored build cache
    purpose: >-
      Official Microsoft WDM/WaveRT virtual-audio sample used first unchanged in
      an approved Windows lab, then minimized into the CapyIO Speaker render
      endpoint only after build, enumeration and licensing evidence.
    alternatives_considered:
      - new WDM audio driver from an empty template
      - third-party virtual cable dependency
      - continue mirroring an existing physical or RDP endpoint
    distribution_note: >-
      The source subset is redistributed under MS-PL with the complete license
      in LICENSES/MS-PL.txt and attribution in THIRD_PARTY_NOTICES.md. No
      Microsoft-built binary is imported. CapyIO-built driver binaries are not
      release artifacts until signing and distribution review is complete.
