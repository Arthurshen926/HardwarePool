        distributed_by_capyio: false
    distribution_note: >-
      CapyIO does not copy, link, vendor, repackage or distribute MicYou in this
      slice. The Adapter launches only a user-supplied local build of exact
      v2.0.1 carrying the reviewed device-stable-id-v1 patch, and rejects an
      unmodified CLI. The GPL patch/source and binary remain outside this
      repository. Installing the upstream APK remains an explicit local-lab
      action; public redistribution and the Windows virtual-microphone package
      require separate legal and release review.
