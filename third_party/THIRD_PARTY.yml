      authenticode_status: Valid
      signer: Cloudyne Systems (Scheibling Consulting AB)
      signer_thumbprint: 9AC56B6C76141395D74FFF6652818376E80B9C95
      driver_signing: Microsoft attestation signed
    reviewed_cli_contract:
      version: 0.9.7.7
      server_scope: explicit IPv4 loopback only
      expected_export_bus_id: VIIPER <bus>-<device>
      expected_export_vid_pid: 045e:028e
      attach_mode: one shot (--once), never persistent
      cleanup: exact returned hub port, never detach all
      process_bounds: absolute deadline plus independent stdout/stderr limits
    security_findings:
      - installation restarts USB 3.0 hubs and can require a Windows restart
      - driver install/remove, restart and first device attachment require separate approval
      - selected v0.9.7.7 is retained because v0.9.7.8 carries an upstream memory-corruption/BSOD warning
      - installation and rollback must never change test signing, Secure Boot or the trusted root store
      - an interrupted attachment gate requires exact-port inspection and cleanup
    distribution_note: >-
      The reviewed executable and drivers are installed only on the separately
      authorized local-lab host and are not copied into the repository or
      distributed by CapyIO. Product bundling needs independent legal,
      servicing, signing and recovery review.
